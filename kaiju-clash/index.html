//  MAIN UPDATE
// ═══════════════════════════════════════════
let tick = 0;

// Riot Mecha boss: telegraph -> slam (ground shockwave) -> vulnerable (stomp the head) -> repeat.
function updateBoss(dt, s){
  const b = s.level.boss; if(!b) return;
  const pl = s.player, PW=44, PH=66;
  b.flashMs = Math.max(0,(b.flashMs||0)-dt);
  b.stateMs -= dt;
  b.dir = pl.x < b.x ? -1 : 1;

  if(b.state==='intro'){
    if(b.stateMs<=0){ b.state='telegraph'; b.stateMs=b.cfg.teleMs; b.firedTele=false; }
  } else if(b.state==='telegraph'){
    if(b.cfg.shoots && !b.firedTele){ b.firedTele=true;                      // GIANT: cannon energy-bolt volley — jump over them
      for(let i=0;i<b.cfg.shoots;i++) s.level.bolts.push({x:b.x+b.w/2 - i*46*b.dir, y:b.footY-26, vx:b.dir*5.5});
      sndCreature('clank',false);
    }
    if(b.stateMs<=0){ b.state='slam'; b.stateMs=900; b.vy=-7; b.slamDone=false; }
  } else if(b.state==='slam'){
    b.yOff = (b.yOff||0) + (b.vy||0); b.vy += 0.7;
    if(b.yOff>=0){ b.yOff=0; b.vy=0;
      if(!b.slamDone){ b.slamDone=true; addShake(9,320); sndRoar();
        for(let i=0;i<b.cfg.waves;i++){ const d=(i%2)?1:-1; s.level.shocks.push({x:b.x+b.w/2, dir:d, dist:i*36}); }   // riot=2 / giant=3 waves
      }
    }
    if(b.stateMs<=0){ b.state='vulnerable'; b.stateMs=b.cfg.vulnMs; b.vulnerable=true; }
  } else if(b.state==='vulnerable'){
    if(b.stateMs<=0){ b.vulnerable=false; b.state='telegraph'; b.stateMs=b.cfg.teleMs; b.firedTele=false; }
  } else if(b.state==='defeated'){
    if(b.stateMs<=0) startBonus();   // end-of-world: match-the-words bonus, then victory
    return;
  }

  const by = b.y + (b.yOff||0), bx=b.x, bw=b.w, bh=b.h, headTop=by, headH=32;

  // Stomp the exposed head while vulnerable -> damage the boss
  if(b.vulnerable && pl.vy>0){
    const prevFeet = pl.y+PH - pl.vy;
    if(pl.x+PW-8>bx && pl.x+8<bx+bw && prevFeet<=headTop+12 && pl.y+PH>=headTop){
      b.hp--; b.flashMs=200; b.vulnerable=false; addShake(7,280);
      sndCreature('clank', b.hp<=0); if(b.hp<=0) sndRoar();
      pl.vy=-10; pl.stompCombo=0; s.score+=250;
      pushMsg(s,'💥 WEAK POINT!',900,'#ffee44','lg'); pushNum(s,bx+bw/2,by-12,'HIT!','#ff8844');
      if(b.hp<=0){ b.state='defeated'; b.stateMs=1700; s.score+=1500; pushMsg(s,'🏆 '+b.name+' DOWN!',2600,'#22ffaa','lg'); }
      else { b.state='telegraph'; b.stateMs=b.cfg.teleMs; b.firedTele=false; }
    }
  }
  // Body contact hurts the player (when not stomping the head)
  if(pl.invincMs<=0 && b.state!=='defeated'){
    if(pl.x<bx+bw && pl.x+PW>bx && pl.y<by+bh && pl.y+PH>by+headH){
      pl.hp=Math.max(0,pl.hp-14); pl.invincMs=1400; s.hitsTaken++;
      pl.vx = pl.x<bx+bw/2?-6:6; pl.vy=-5; addShake(5,200);
      pushNum(s,pl.x,pl.y-20,'-14','#ff3333'); sndHurt();
    }
  }
  // Ground shockwaves — jump to avoid
  s.level.shocks.forEach(w=>{ w.dist+=5; w.x+=w.dir*5; });
  s.level.shocks = s.level.shocks.filter(w=>w.dist<460);
  if(pl.invincMs<=0 && pl.onGround && b.state!=='defeated'){
    s.level.shocks.forEach(w=>{
      if(Math.abs((pl.x+PW/2)-w.x)<22){
        pl.hp=Math.max(0,pl.hp-10); pl.invincMs=1200; s.hitsTaken++;
        pl.vy=-6; addShake(4,160); pushNum(s,pl.x,pl.y-20,'-10','#ffaa33'); sndHurt();
      }
    });
  }
  // Energy bolts (GIANT) — travel low; JUMP to clear them
  const bolts = s.level.bolts || (s.level.bolts=[]);
  bolts.forEach(bo=>{ bo.x += bo.vx; });
  s.level.bolts = bolts.filter(bo=> bo.x>s.cam.x-50 && bo.x<s.cam.x+VW+50);
  if(pl.invincMs<=0 && b.state!=='defeated'){
    s.level.bolts.forEach(bo=>{
      if(Math.abs((pl.x+PW/2)-bo.x)<16 && pl.y+PH>bo.y-8 && pl.y<bo.y+10){
        pl.hp=Math.max(0,pl.hp-12); pl.invincMs=1200; s.hitsTaken++;
        pl.vy=-5; pl.vx=bo.vx>0?6:-6; addShake(4,160); pushNum(s,pl.x,pl.y-20,'-12','#5ad6ff'); sndHurt(); bo.dead=true;
      }
    });
    s.level.bolts = s.level.bolts.filter(bo=>!bo.dead);
  }
}

// Riot-Mecha boss — real Higgsfield pixel-art sprites (bosses/riot_{idle,windup,slam,defeat}.png),
// state -> frame; hit-flash / ground-shockwaves / defeat-collapse are code FX layered over the sprite.
function drawBoss(s){
  const b=s.level.boss; if(!b) return;
  const cam=s.cam;
  const bx=~~(b.x-cam.x), by=~~(b.y+(b.yOff||0)-cam.y), bw=b.w, bh=b.h;
  const flash=b.flashMs>0, vuln=b.vulnerable, tele=b.state==='telegraph';

  // ground shockwaves (arcs travelling out along the floor)
  const wy=~~(b.footY-cam.y);
  s.level.shocks.forEach(w=>{
    const a=Math.max(0,1-w.dist/460);
    ctx.strokeStyle='rgba(255,170,60,'+a.toFixed(2)+')'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(~~(w.x-cam.x), wy, 8+w.dist*0.14, Math.PI, 2*Math.PI); ctx.stroke();
  });
  // GIANT energy bolts — glowing cyan orbs the player jumps over
  (s.level.bolts||[]).forEach(bo=>{ const bxp=~~(bo.x-cam.x), byp=~~(bo.y-cam.y);
    ctx.save(); ctx.shadowColor='#5ad6ff'; ctx.shadowBlur=12;
    ctx.fillStyle='#bdefff'; ctx.beginPath(); ctx.arc(bxp,byp,7,0,7); ctx.fill();
    ctx.fillStyle='rgba(90,214,255,0.5)'; ctx.beginPath(); ctx.arc(bxp-bo.vx*1.5,byp,5,0,7); ctx.fill();   // trail
    ctx.restore();
  });

  // ── Real pixel-art sprite path (once Higgsfield frames land) — keeps the shockwaves above and the
  // hit-flash / defeat-collapse FX, then returns BEFORE the procedural placeholder body below. ──
  const fr = b.frames || 'riot';
  const frameKey = b.state==='defeated' ? fr+'_defeat'
                 : (b.state==='telegraph' ? fr+'_windup'
                 : (b.state==='slam' ? fr+'_slam' : fr+'_idle'));
  const bimg = loadedSprites[frameKey] || loadedSprites[fr+'_idle'];
  if(bimg){
    const Tn=Date.now();
    ctx.save();
    if(b.state==='telegraph') ctx.translate(Math.sin(Tn*0.03)*2.5,0);           // wind-up wobble
    if(b.state==='defeated'){ const k=1700-b.stateMs; ctx.translate(0,Math.min(18,k*0.014)); ctx.rotate(b.dir*Math.min(0.12,k*0.0001)); }
    const dh=bh*1.35, dw=dh*(bimg.naturalWidth/bimg.naturalHeight);             // a bit taller than the hitbox (frames are trimmed → feet at image bottom)
    const dx=bx+bw/2-dw/2, dy=by+bh-dh;                                         // feet planted on the ground (image bottom = hitbox bottom = footY)
    if(b.dir>0){ ctx.translate(bx+bw/2,0); ctx.scale(-1,1); ctx.translate(-(bx+bw/2),0); }  // face travel dir
    ctx.drawImage(bimg, ~~dx, ~~dy, ~~dw, ~~dh);
    if(b.flashMs>0){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.6; ctx.drawImage(bimg,~~dx,~~dy,~~dw,~~dh); }  // white-ish hit flash
    ctx.restore();
  }


  // HP pips (screen-fixed) — sits BELOW the center fart meter so they don't overlap
  const pips=b.maxHp, pw=18, gap=4, tot=pips*pw+(pips-1)*gap, x0=VW/2-tot/2;
  ctx.fillStyle='#fff'; ctx.font='bold 7px monospace'; ctx.textAlign='center';
  ctx.fillText(b.name||'⚙ RIOT MECHA', VW/2, 38); ctx.textAlign='left';
  ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(x0-4,42,tot+8,14);
  for(let i=0;i<pips;i++){ ctx.fillStyle=i<b.hp?'#ff4444':'#553333'; ctx.fillRect(x0+i*(pw+gap),44,pw,10); }
}

function update(dt){
  if(scene!=='playing' || !state) return;
  if(pressedBook()){ _bookReturn='playing'; scene='wordbook'; _bookPage=0; justDn.clear(); return; }   // pause to the Word Book from in-game
  const s = state;
  tick++;

  updatePlayer(dt, s);
  updateFood(dt, s);
  updateGems(dt, s);
  updateFartCloud(dt, s);
  updateEnemies(dt, s);
  updateCitizens(dt, s);
  updateBoss(dt, s);

  // Decay messages + damage numbers
  s.msgs = s.msgs.filter(m=>{ m.timer-=dt; return m.timer>0; });
  s.dmgNums = s.dmgNums.filter(n=>{ n.life-=dt; n.y-=0.6; return n.life>0; });

  // Decay screen shake
  if(_shakeMs>0){
    _shakeMs-=dt;
    _shakeX=(Math.random()-0.5)*_shakeAmt*2;
    _shakeY=(Math.random()-0.5)*_shakeAmt*2;
    if(_shakeMs<=0){ _shakeX=0; _shakeY=0; _shakeAmt=0; }
  }

  if(s.player.hp<=0 && scene==='playing'){ scene='gameover'; sndGameOver(); }
}

function _shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startBonus(){
  // pool = every word this world taught (rescue + food + enemy), deduped by meaning
  const pool = [
    ..._vocab().map(w=>({jp:w.jp,ro:w.ro,en:w.en,aud:'jp_'+w.key+'_f'})),
    ...FOOD_TYPES.map(f=>({jp:f.jp,ro:f.ro,en:f.en,aud:'jp_'+f.key+'_f'})),
    ...Object.entries(ENEMIES).filter(([k,e])=>e.world===1).map(([k,e])=>({jp:e.jp,ro:e.ro,en:e.en,aud:'jp_'+k+'_m'})),
  ];
  const seen={}, uniq=pool.filter(w=> !seen[w.en] && (seen[w.en]=1));
  const words = _shuffle(uniq).slice(0,6);   // harder: 6 pairs to match
  _bonus = { words, meanings:_shuffle(words.map(w=>w.en)), sel:null, matched:[], wrong:null, score:0, done:false };
  _bonusClick=null; scene='bonus';

function drawBonus(){
  const B=_bonus, n=B.words.length;
  const startY=82, rowH=46, bw=224, bh=38, leftX=28, rightX=VW-28-bw;
  const hit=(x,y,bx,by)=> x>=bx && x<=bx+bw && y>=by && y<=by+bh;
  if(_bonusClick){
    const {x,y}=_bonusClick; _bonusClick=null;
    if(B.done){ state.score += B.score+200; finishLevel(); return; }
    for(let i=0;i<n;i++) if(!B.matched.includes('w'+i) && hit(x,y,leftX,startY+i*rowH)){ B.sel=(B.sel===i?null:i); B.wrong=null; }
    for(let j=0;j<n;j++) if(!B.matched.includes('m'+j) && hit(x,y,rightX,startY+j*rowH) && B.sel!=null){
      if(B.meanings[j]===B.words[B.sel].en){ B.matched.push('w'+B.sel,'m'+j); B.score+=100; playSample(B.words[B.sel].aud,1.0,0); B.sel=null; if(B.matched.length>=n*2) B.done=true; }   // ONLY the clear spoken word — no cheer/music interference
      else { B.wrong={m:j,t:Date.now()}; B.sel=null; sndHurt(); }
    }
  }
  if(B.done && menuConfirm()){ state.score += B.score+200; finishLevel(); return; }
  ctx.fillStyle='#150d2c'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center'; ctx.fillStyle='#ffe14d'; ctx.font='bold 22px sans-serif'; ctx.fillText('🎌 BONUS — MATCH THE WORDS!', VW/2, 38);
  ctx.fillStyle='#bfe9ff'; ctx.font='12px sans-serif'; ctx.fillText('Tap a Japanese word, then its meaning', VW/2, 58);
  ctx.font='bold 15px sans-serif';
  for(let i=0;i<n;i++){ const ry=startY+i*rowH, done=B.matched.includes('w'+i);
    ctx.fillStyle=done?'#21663a':(B.sel===i?'#34509c':'#241b48'); rrect(leftX,ry,bw,bh,8); ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle=B.sel===i?'#9bb6ff':'#463c70'; rrect(leftX,ry,bw,bh,8); ctx.stroke();
    ctx.fillStyle=done?'#9affb5':'#fff'; ctx.textAlign='center'; ctx.fillText(B.words[i].jp+'  '+B.words[i].ro, leftX+bw/2, ry+24); }
  for(let j=0;j<n;j++){ const ry=startY+j*rowH, done=B.matched.includes('m'+j), wrong=B.wrong&&B.wrong.m===j&&Date.now()-B.wrong.t<450;
    ctx.fillStyle=done?'#21663a':(wrong?'#7a2230':'#241b48'); rrect(rightX,ry,bw,bh,8); ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#463c70'; rrect(rightX,ry,bw,bh,8); ctx.stroke();
    ctx.fillStyle=done?'#9affb5':'#fff'; ctx.textAlign='center'; ctx.fillText(B.meanings[j], rightX+bw/2, ry+24); }
  ctx.textAlign='left';
  if(B.done){ ctx.fillStyle='rgba(0,0,0,0.62)'; ctx.fillRect(0,VH/2-34,VW,64);
    ctx.textAlign='center'; ctx.fillStyle='#ffe14d'; ctx.font='bold 24px sans-serif'; ctx.fillText('✨ PERFECT!  +'+(B.score+200), VW/2, VH/2-4);
    ctx.globalAlpha=0.6+0.4*Math.sin(Date.now()*0.005); ctx.fillStyle='#fff'; ctx.font='14px sans-serif'; ctx.fillText('TAP / SPACE TO CONTINUE ▶', VW/2, VH/2+20); ctx.globalAlpha=1; ctx.textAlign='left'; }

const CRANE_SEQ = ['crane_up','crane_mid','crane_down','crane_mid'];
const CRANE_SZ = 184;
function drawWingedMonster(cx, cy, t){
  const fr = loadedSprites[CRANE_SEQ[Math.floor(t/130)%4]] || loadedSprites['crane_mid'];
  if(!fr) return;
  const sm = ctx.imageSmoothingEnabled; ctx.imageSmoothingEnabled = true;   // smooth the hi-res sprite downscale

}
function drawCarry(){
  if(!_carry){ scene='playing'; return; }            // safety: never run with no cinematic in flight
  _carry.t += 16; const pr = Math.min(1, _carry.t/_carry.dur);
  const fc = Math.floor(_carry.t/483);               // one wingbeat per sine cycle
  if(fc !== _carry._fc){ _carry._fc = fc; if(_carry.t>40) sndFlap(); }
  drawBg((_savedLevel&&_savedLevel.cam)||{x:0,y:0});

// HTML overlay text prompt -> Promise<string|null> (works on canvas; testable in headless)
function _lbPromptText(label, upper){
  const ov=document.getElementById('lbov'), inp=document.getElementById('lbinput'), lab=document.getElementById('lblabel');
  return new Promise(res=>{
    lab.textContent=label; inp.value=''; inp.maxLength=upper?6:16; inp.style.textTransform=upper?'uppercase':'none'; ov.style.display='flex'; setTimeout(()=>inp.focus(),30);
    const done=(v)=>{ ov.style.display='none'; document.getElementById('lbok').onclick=null; document.getElementById('lbcancel').onclick=null; inp.onkeydown=null; res(v); };
    document.getElementById('lbok').onclick=()=>done(inp.value.trim()||null);
    document.getElementById('lbcancel').onclick=()=>done(null);
    inp.onkeydown=(e)=>{ e.stopPropagation(); if(e.key==='Enter')done(inp.value.trim()||null); else if(e.key==='Escape')done(null); };
  });
}

function _mastery(){ return meta.mastery || (meta.mastery = {}); }
function _profScore(){ const m=_mastery(); let s=0; for(const k in m) s+=Math.min(m[k]||0,3); return s; }   // total mastery points (cap 3/word)
function _profTier(s){ return s>=60?'先生 Sensei': s>=36?'Fluent': s>=18?'Apprentice': s>=6?'Student':'Novice'; }
function _qShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
let _quiz=null, _quizReturn='overworld', _quizMsg='';
function _quizPool(){ const idx=_wordIndex(); return Object.keys(meta.learned||{}).filter(k=>idx[k]).map(k=>({id:k,...idx[k]})); }
function _quizStart(ret){
  const pool=_quizPool();
  if(pool.length<4){ _quizMsg='Learn at least 4 words first — play levels & grab 💎 word-gems!'; return false; }
  _quizReturn=ret||'overworld'; _quizMsg='';
  const N=Math.min(8,pool.length), targets=_qShuffle(pool.slice()).slice(0,N), types=['listen','read','recall'];
  const qs=targets.map((t,qi)=>{ const type=types[qi%3];
    const distract=_qShuffle(pool.filter(w=>w.id!==t.id)).slice(0,3);
    const opts=_qShuffle([t].concat(distract));
    return {t,type,opts,ans:opts.indexOf(t)}; });
  _quiz={qs,i:0,correct:0,sel:-1,answered:false,gained:0,done:false}; scene='quiz';
  if(qs[0].type==='listen') _quizPlay();
  return true;
}
function _quizPlay(){ const q=_quiz&&_quiz.qs[_quiz.i]; if(q) try{ playSample(q.t.aud,1.0,0,true); }catch(e){} }
function _quizAnswer(i){ if(!_quiz||_quiz.answered||_quiz.done) return; const q=_quiz.qs[_quiz.i];
  _quiz.sel=i; _quiz.answered=true;
  if(i===q.ans){ _quiz.correct++; const m=_mastery(); m[q.t.id]=Math.min(3,(m[q.t.id]||0)+1); _quiz.gained++; saveMeta(); _quizPlay(); }
  else { try{sndHurt();}catch(e){} }
}
function _quizNext(){ if(!_quiz) return;
  if(_quiz.i<_quiz.qs.length-1){ _quiz.i++; _quiz.sel=-1; _quiz.answered=false; if(_quiz.qs[_quiz.i].type==='listen') _quizPlay(); }
  else { _quiz.done=true; _lbSyncWords(); try{sndVictory();}catch(e){} }
}

function render(){
  // Reset to the base transform every frame (absolute), then apply shake — so the early
  // returns in the select/playing branches can't leak an unbalanced save() and drift.
  if(_baseTransform) ctx.setTransform(_baseTransform);
  if(_shakeMs>0) ctx.translate(_shakeX, _shakeY);
  ctx.clearRect(0,0,VW,VH);
  ctx.font='8px monospace';

  if(scene==='overworld'){ updateOverworld(); }

  if(scene==='carry'){ drawCarry(); drawAudioBtn(); return; }
  if(scene==='bonus'){ drawBonus(); drawAudioBtn(); return; }
  if(scene==='wordbook'){ drawWordBook(); drawAudioBtn();
    if((menuBack() || pressedBook())) scene=_bookReturn;   // keyboard exit -> back to map or the game
    return; }
  if(scene==='leaderboard'){ drawLeaderboard(); drawAudioBtn();
    if(menuBack()){ scene='overworld'; justDn.clear(); }
    return; }
  if(scene==='quiz'){ drawQuiz(); drawAudioBtn();
    if(menuBack()){ scene=_quizReturn; justDn.clear(); }
    return; }

  if(scene==='howto'){
    if(state) drawBg(state.cam);
    drawHowTo();
    const freshTap = Object.keys(touches).length>0 && !_lastTouchCount;
    if(menuConfirm() || _hit('fart') || freshTap){
      scene='playing'; state.startTick = tick;          // start the clock when play actually begins
    }
    _lastTouchCount = Object.keys(touches).length;
    drawAudioBtn();
    return;
  }

  if(scene==='select'){
    // Keyboard input
    if(menuLeft())  selIdx=(selIdx-1+SEL_CHARS.length)%SEL_CHARS.length;
    if(menuRight()) selIdx=(selIdx+1)%SEL_CHARS.length;
    if(menuConfirm()){
      acResume();
      scene='overworld'; owIdx=0;
    }
    // Touch input — tap left/right half to select, tap again to start
    const rect2 = canvas.getBoundingClientRect();
    const freshTap = Object.keys(touches).length > 0 && !_lastTouchCount;
    if(freshTap && rect2.width){
      const scX2 = VW / rect2.width;
      const tx = (Object.values(touches)[0].x - rect2.left) * scX2;
      if(tx < VW/2) selIdx=0; else selIdx=1;
      acResume();
      scene='overworld'; owIdx=0;
    }
    _lastTouchCount = Object.keys(touches).length;
    drawSelect();
    return;
  }

  if(scene==='playing' && state){
    const s = state;
    const pl = s.player;
    const PW=44;

    drawBg(s.cam);
    drawTiles(s);
    drawFood(s);
    drawGems(s);
    drawCitizens(s);
    drawFartCloud(s);
    drawEnemies(s);
    drawBoss(s);

    // Draw player character
    const px = ~~(pl.x - s.cam.x);
    const py = ~~(pl.y - s.cam.y);
    if(s.charKey==='lulah') drawLulah(px, py, pl, tick);
    else                    drawPoppy(px, py, pl, tick);

    // Exit portal — drawn at the actual 'E' tile (boss arenas have no exit)
    if(!s.level.boss){
    const exT = s.level.exit;
    const ex = ~~((exT ? exT.c*TS : (LW-3)*TS) - s.cam.x + TS/2);
    const eyTop = ~~((exT ? exT.r*TS : 8*TS) - s.cam.y) - TS;
    const need=(s.level.gems||[]).length, got=s.gemsCollected||0, locked = need>0 && got<need;
    const ec = locked ? '#ff7744' : '#22ffaa';                 // gate is orange+locked until the words are collected
    const t2 = Date.now()*0.003;
    ctx.shadowColor=ec; ctx.shadowBlur=16+Math.sin(t2)*6;
    ctx.strokeStyle=ec; ctx.lineWidth=3;
    ctx.strokeRect(ex-20, eyTop, 40, 2.5*TS);
    ctx.shadowBlur=0;
    ctx.textAlign='center'; ctx.font='bold 8px monospace'; ctx.fillStyle=ec;
    ctx.fillText(locked ? ('🔒 '+got+'/'+need) : 'EXIT ▶', ex, eyTop-4); ctx.textAlign='left';
    }
    // Secret door — HIDDEN by default (faint shimmer hint); FART near it to reveal the glowing portal.
    if(s.level.door && !s.level.door.used){
      const d=s.level.door, dx=~~(d.c*TS - s.cam.x + TS/2), dyT=~~(d.r*TS - s.cam.y) - 6, t3=Date.now()*0.005;
      if(d.hidden){
        const a=0.07+0.06*Math.abs(Math.sin(t3*0.8));   // barely-there shimmer
        ctx.globalAlpha=a; ctx.textAlign='center'; ctx.font='12px serif'; ctx.fillText('✨', dx, dyT+18); ctx.globalAlpha=1; ctx.textAlign='left';
      } else {
        ctx.save(); ctx.shadowColor='#c66bff'; ctx.shadowBlur=14+Math.sin(t3)*6;
        ctx.strokeStyle='#c66bff'; ctx.lineWidth=3; rrect(dx-13, dyT, 26, TS+10, 9); ctx.stroke();
        ctx.fillStyle='rgba(170,80,255,0.18)'; rrect(dx-13, dyT, 26, TS+10, 9); ctx.fill(); ctx.restore();
        ctx.textAlign='center'; ctx.font='14px serif'; ctx.fillText('🌟', dx, dyT+22); ctx.textAlign='left';
      }
    }

    drawHUD(s);
    drawTouchControls();
    return;
  }

  if(scene==='victory'){
    if(menuConfirm() || _lastTouchCount>0){
      scene='overworld';
    }
    if(state) drawBg(state.cam); drawVictory();
  }
  if(scene==='gameover') { if(state) drawBg(state.cam); drawGameover(); }
  if(scene==='overworld'){ drawOverworld(); drawTouchControls(); drawBookBtn(); drawLbBtn(); }  // touch buttons + word-book + leaderboard access
}

function updateOverworld(){
  const nodes = Progression.LEVELS;
  const freshTap = Object.keys(touches).length > 0 && !_lastTouchCount;
  // Touch nav moves ONE node per fresh tap (held would skip straight to the end).
  if(menuRight() || (freshTap && touchInBtn('right'))) owIdx = Math.min(nodes.length-1, owIdx+1);
  if(menuLeft()  || (freshTap && touchInBtn('left')))  owIdx = Math.max(0, owIdx-1);
  if(pressedBook()){ _bookReturn='overworld'; scene='wordbook'; _bookPage=0; justDn.clear(); return; }   // open the word book (clear B so it doesn't instantly close)
  const sel = nodes[owIdx];
  const unlocked = Progression.isLevelUnlocked(meta, sel.id);
  if((menuConfirm() || (freshTap && (touchInBtn('jump')||touchInBtn('fart')))) && unlocked && sel.playable){
    state = mkState(SEL_CHARS[selIdx], sel.id);
    if(sel.id==='w1l1'){ scene = 'howto'; justDn.clear(); }   // quick how-to before level 1 (clear the start key so it doesn't instantly dismiss)
    else { scene = 'playing'; state.startTick = tick; }
  }
  _lastTouchCount = Object.keys(touches).length;
}

function drawOverworld(){
  ctx.fillStyle='#1b1030'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';
  ctx.fillStyle='#ffd84a'; ctx.font='bold 28px monospace';
  ctx.fillText('KAIJU CLASH', VW/2, 48);
  ctx.font='14px monospace'; ctx.fillStyle='#cfc6e6';
  ctx.fillText('Spirit Orbs: '+meta.orbs+'   Growth: '+(Progression.GROWTH_STAGES[meta.growthStage]||Progression.GROWTH_STAGES[0]).name, VW/2, 74);

  const nodes = Progression.LEVELS;
  const gap = VW/(nodes.length+1);
  const cy = VH/2;
  for(let i=0;i<nodes.length;i++){
    const n = nodes[i];
    const cx = gap*(i+1);
    const unlocked = Progression.isLevelUnlocked(meta, n.id);
    // connector
    if(i>0){ ctx.strokeStyle='#4a3a66'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(gap*i, cy); ctx.lineTo(cx, cy); ctx.stroke(); }
    // node circle — a window into the world's backdrop when unlocked
    const R = 27;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.clip();
    const bg = unlocked ? loadedSprites['bg_w'+n.world] : null;
    if(bg){ ctx.drawImage(bg, cx-R, cy-R, R*2, R*2); }
    else  { ctx.fillStyle = unlocked ? '#ff6db0' : '#3a2f50'; ctx.fillRect(cx-R, cy-R, R*2, R*2); }
    ctx.restore();
    // ring (highlighted node gets a thick white ring)
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
    ctx.strokeStyle = (i===owIdx) ? '#fff' : (unlocked ? '#ffd84a' : '#4a3a66');
    ctx.lineWidth   = (i===owIdx) ? 3 : 2; ctx.stroke();
    // number badge / lock
    ctx.textAlign='center';
    if(unlocked){
      ctx.fillStyle='rgba(10,6,20,0.6)'; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 16px monospace'; ctx.fillText(String(i+1), cx, cy+6);
    } else {
      ctx.fillStyle='#9a8fb5'; ctx.font='bold 20px monospace'; ctx.fillText('🔒', cx, cy+7);
    }
    // stars (per node, above)
    const rec = meta.levels[n.id];
    if(rec){
      ctx.fillStyle='#ffd84a'; ctx.font='14px monospace';
      ctx.fillText('★'.repeat(rec.stars), cx, cy-40);
    }
  }
  // ONLY the selected node's name — full names overlap badly with 8 nodes in a row
  const selN = nodes[owIdx], selOk = Progression.isLevelUnlocked(meta, selN.id);
  ctx.textAlign='center'; ctx.fillStyle = selOk ? '#fff' : '#7d7299'; ctx.font='bold 17px monospace';
  ctx.fillText('World '+selN.world+' · '+(selOk ? selN.name : '🔒 Locked'), VW/2, cy+72);
  ctx.fillStyle='#cfc6e6'; ctx.font='12px monospace';
  ctx.fillText('← → choose   ↑/Space enter', VW/2, VH-24);
  ctx.textAlign='left';
}

// ═══════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════
let lastT = 0, spritesReady = false;
const FIXED = 1000/60;   // one simulation step = 1/60s, regardless of display refresh
let _acc = 0;            // accumulated real time waiting to be simulated
function loop(ts){
  if(!spritesReady){
    ctx.fillStyle='#000911'; ctx.fillRect(0,0,VW,VH);
    ctx.textAlign='center'; ctx.fillStyle='#22ffaa'; ctx.font='bold 12px monospace';
    ctx.fillText('LOADING '+_spriteDone+'/'+_spriteCount+'...', VW/2, VH/2-8);
    ctx.fillStyle='#0a2a1a'; ctx.fillRect(VW/2-60,VH/2+4,120,8);
    ctx.fillStyle='#22ffaa';
    ctx.fillRect(VW/2-60,VH/2+4,Math.round(120*_spriteDone/Math.max(_spriteCount,1)),8);
    ctx.textAlign='left';
    requestAnimationFrame(loop);
    return;
  }
  // ── Fixed-timestep simulation ──────────────────────────────────────────────
  // Physics uses fixed per-frame steps (pl.x += pl.vx, vy += GRAV), so the sim MUST advance
  // at a constant 60 steps/sec no matter the display refresh — otherwise a 120Hz ProMotion
  // screen runs the game 2x too fast (twitchy controls) and frame dips make it lurch.
  // Accumulate real elapsed time, step the sim in fixed FIXED-ms chunks, render once per rAF.
  let frameDt = ts - lastT;
  lastT = ts;
  if(frameDt > 250) frameDt = 250;        // tab was backgrounded — clamp, don't spiral
  _acc += frameDt;
  // A thrown error (e.g. a Safari Web Audio quirk in a sound call) must never freeze the
  // game or kill the music — isolate the frame.
  try {
    let steps = 0;
    while(_acc >= FIXED && steps < 5){
      update(FIXED);
      if(scene==='playing') justDn.clear();   // one-shots (fart) fire once per press, not per catch-up step
      _acc -= FIXED; steps++;
    }
    if(steps >= 5) _acc = 0;                   // fell badly behind — drop the debt, don't fast-forward
    render(); drawAudioBtn();
  }
  catch(err){ if(!loop._logged){ console.error('frame error:', err); loop._logged=true; } }
  if(scene==='playing') startMusic(); else stopMusic();
  justDn.clear();
  requestAnimationFrame(loop);
}
loadSfx();   // try real samples (sounds/*.{mp3,wav}); silently no-ops until they exist
loadJpVoices();   // spoken Japanese vocab clips (sounds/jp/*.mp3)
Promise.all([loadSprites(), loadSkin(activeSkin), loadEnemies(), loadNpcs(), loadFood(), loadBoss(), loadCrane()]).then(()=>{ spritesReady=true; lastT=performance.now(); });
requestAnimationFrame(loop);
</script>
