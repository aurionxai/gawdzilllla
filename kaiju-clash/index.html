//  CANVAS
// ═══════════════════════════════════════════
const VW = 640, VH = 360;
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() {
  const vvp = window.visualViewport;
  const W = vvp ? vvp.width  : innerWidth;
  const H = vvp ? vvp.height : innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const sc  = Math.min(W / VW, H / VH);
  canvas.width  = Math.round(VW * sc * dpr);
  canvas.height = Math.round(VH * sc * dpr);
  canvas.style.width  = Math.round(VW * sc) + 'px';
  canvas.style.height = Math.round(VH * sc) + 'px';
  ctx.setTransform(sc * dpr, 0, 0, sc * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize, 120));
if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

const AC = new (window.AudioContext||window.webkitAudioContext)();

// ═══════════════════════════════════════════
//  SPRITES
// ═══════════════════════════════════════════
const SPRITES = {
  // Hero frames come from the active SKIN; enemies from the ENEMIES registry;
  // citizens (townsfolk) from NPC_TYPES. None are hardcoded here.
  // World backdrops (local, per Progression world): drawBg picks bg_w<N> by level id.
  bg_w1:         'bg/world1.jpg',   // Tokyo Day
  bg_w2:         'bg/world2.jpg',   // Neon Shibuya
  bg_w3:         'bg/world3.jpg',   // Sunken City (underwater)
  bg_w4:         'bg/world4.jpg',   // Volcano Skyline
};
const loadedSprites = {};
let _spriteCount = 0, _spriteDone = 0;
function loadSprites() {
  const entries = Object.entries(SPRITES);
  _spriteCount = entries.length;
  return Promise.all(entries.map(([key, url]) => new Promise(res => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => { loadedSprites[key] = img; _spriteDone++; res(); };
    img.onerror = () => { _spriteDone++; res(); };
    img.src = url;
  })));
}

function acResume(){ if(AC.state==='suspended') AC.resume(); }

function sndChomp(){
  acResume();
  const buf = AC.createBuffer(1, AC.sampleRate*0.14, AC.sampleRate);
  const d   = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5)*0.5;
  const src  = AC.createBufferSource();
  const gain = AC.createGain();
  src.buffer=buf; gain.gain.value=0.45;
  src.connect(gain); gain.connect(AC.destination); src.start();
}

function sndFart(size){ // 1=tiny 2=medium 3=mega
  acResume();
  const dur  = [0,0.35,0.9,2.2][size];
  const sf   = [0,220,300,380][size];
  const ef   = [0,70,55,40][size];
  const osc  = AC.createOscillator();
  const lfo  = AC.createOscillator();
  const lfoG = AC.createGain();
  const gain = AC.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(sf, AC.currentTime);
  osc.frequency.exponentialRampToValueAtTime(ef, AC.currentTime+dur);
  lfo.frequency.value = [0,14,9,5][size];
  lfoG.gain.value = size*22;
  lfo.connect(lfoG); lfoG.connect(osc.frequency);
  gain.gain.setValueAtTime(0.55, AC.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
  osc.connect(gain); gain.connect(AC.destination);
  lfo.start(); osc.start();
  lfo.stop(AC.currentTime+dur); osc.stop(AC.currentTime+dur);
}

function sndJump(){
  acResume();
  const osc=AC.createOscillator(), g=AC.createGain();
  osc.type='square';
  osc.frequency.setValueAtTime(280,AC.currentTime);
  osc.frequency.exponentialRampToValueAtTime(520,AC.currentTime+0.09);
  g.gain.setValueAtTime(0.09,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.12);
  osc.connect(g); g.connect(AC.destination);
  osc.start(); osc.stop(AC.currentTime+0.12);
}

function sndHurt(){
  acResume();
  const osc=AC.createOscillator(), g=AC.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(180,AC.currentTime);
  osc.frequency.exponentialRampToValueAtTime(90,AC.currentTime+0.25);
  g.gain.setValueAtTime(0.2,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.25);
  osc.connect(g); g.connect(AC.destination);
  osc.start(); osc.stop(AC.currentTime+0.25);
}

function sndVictory(){
  acResume();
  [523,659,784,1047,1319].forEach((f,i)=>{
    const o=AC.createOscillator(), g=AC.createGain();
    const t=AC.currentTime+i*0.12;
    o.type='square'; o.frequency.value=f;
    g.gain.setValueAtTime(0.12,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t+0.28);
  });
}

function sndGiggle(){
  acResume();
  [560,720,900,1100,900,720].forEach((f,i)=>{
    const o=AC.createOscillator(), g=AC.createGain();
    const t=AC.currentTime+i*0.065;
    o.type='sine';
    o.frequency.setValueAtTime(f,t);
    o.frequency.exponentialRampToValueAtTime(f*1.12,t+0.055);
    g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.1);
  });
}
function sndRoar(){
  acResume();
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(130,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(55,AC.currentTime+0.28);
  g.gain.setValueAtTime(0.32,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.28);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+0.28);
}

// ═══════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════
const keys   = new Set();
const justDn = new Set();

window.addEventListener('keydown', e=>{
  if(AC.state==='suspended') AC.resume();
  const prev = keys.has(e.code);
  keys.add(e.code);
  if(!prev) justDn.add(e.code);
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyZ','KeyJ','KeyX','KeyB'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e=>{ keys.delete(e.code); });

function isDown(...c){ return c.some(k=>keys.has(k)); }
function wasDown(...c){ return c.some(k=>justDn.has(k)); }

// Mobile touch buttons (drawn on canvas, tracked via touch)
const BTNS = {};  // populated in drawTouchControls
let touches = {}, _lastTouchCount = 0;
window.addEventListener('touchstart', e=>{ acResume(); [...e.changedTouches].forEach(t=>{ touches[t.identifier]={x:t.clientX,y:t.clientY}; }); e.preventDefault(); },{passive:false});
window.addEventListener('touchmove',  e=>{ [...e.changedTouches].forEach(t=>{ touches[t.identifier]={x:t.clientX,y:t.clientY}; }); e.preventDefault(); },{passive:false});
window.addEventListener('touchend',   e=>{ [...e.changedTouches].forEach(t=>{ delete touches[t.identifier]; }); e.preventDefault(); },{passive:false});

function touchInBtn(name){
  const b = BTNS[name]; if(!b) return false;
  const rect = canvas.getBoundingClientRect();
  const scX = VW / rect.width, scY = VH / rect.height;
  return Object.values(touches).some(t=>{
    const cx = (t.x - rect.left) * scX;
    const cy = (t.y - rect.top)  * scY;
    return cx>=b.x && cx<=b.x+b.w && cy>=b.y && cy<=b.y+b.h;
  });
}
function isMoveL(){ return isDown('ArrowLeft','KeyA') || touchInBtn('left'); }
function isMoveR(){ return isDown('ArrowRight','KeyD') || touchInBtn('right'); }
function isJump(){  return isDown('ArrowUp','KeyW','Space') || touchInBtn('jump'); }
function isFart(){  return wasDown('KeyZ','KeyJ','KeyX','KeyB') || touchInBtn('fart'); }

// ═══════════════════════════════════════════
//  LEVEL DATA
// ═══════════════════════════════════════════
// T=0 air, T=1 solid, T=2 one-way platform, T=3 destructible
const T_AIR=0, T_SOLID=1, T_PLAT=2, T_DEST=3, T_HAZARD=4;

function buildLevel(){
  const map = Array.from({length:LH}, ()=>new Array(LW).fill(T_AIR));

  // Ground: rows 9-10
  for(let c=0;c<LW;c++){ map[9][c]=T_SOLID; map[10][c]=T_SOLID; }

  // Gaps (col ranges, rows 9-10 become air)
  [[28,32],[50,54],[70,74],[90,94],[105,108]].forEach(([a,b])=>{
    for(let c=a;c<=b;c++){ map[9][c]=T_AIR; map[10][c]=T_AIR; }
  });

  // One-way platforms [row, col_start, col_end]
  [[6,4,10],[5,16,22],[6,26,30],[5,34,40],[4,45,51],
   [6,55,61],[5,65,70],[4,72,78],[6,82,88],[5,96,102],[4,106,110]
  ].forEach(([r,a,b])=>{ for(let c=a;c<=b;c++) map[r][c]=T_PLAT; });

  // Destructible blocks
  [[8,18],[8,19],[8,20],[8,38],[8,39],[8,60],[8,61],[8,80],[8,81],[8,100]
  ].forEach(([r,c])=>{ map[r][c]=T_DEST; });

  return map;
}

function spawnFood(){
  const food = [];
  // Scatter food across the level — on platforms and ground
  const spots = [
    [5,7],[6,12],[4,19],[5,28],[3,36],[4,46],[6,50],[5,57],

    [8,8],[8,25],[8,42],[8,62],[8,78],[8,95],[8,107],
    [3,14],[3,33],[3,55],[3,75],[3,100],

    food.push({
      type: FOOD_TYPES[i%FOOD_TYPES.length],
      x: c*TS + TS/2 - 10,

}

// Convert an ASCII tilemap (array of strings) into a game level object.
function buildFromRows(rows){
  const p = LevelParse.parseLevel(rows);
  LW = p.LW; LH = p.LH;                       // level dims are global, set on build
  // Spawn chars only give a column; the entity must rest on the first solid/platform
  // surface at or below that row (otherwise NPCs/enemies float in mid-air on a tall map).
  const surfaceTop = (col, fromRow)=>{
    for(let r=fromRow; r<p.LH; r++){
      const v = p.tiles[r] && p.tiles[r][col];
      if(v===T_SOLID || v===T_DEST || v===T_PLAT) return r*TS;
    }
    return p.LH*TS;                           // virtual floor below the map
  };
  const food = p.spawns.food.map((s,i)=>({
    type: FOOD_TYPES[i % FOOD_TYPES.length],
    x: s.c*TS + TS/2 - 10, y: surfaceTop(s.c, s.r) - 30, collected:false, bobOff:i*0.8,
  }));
  const enemies = p.spawns.enemies.map(s=>({
    x: s.c*TS, y: surfaceTop(s.c, s.r) - ENEMY_FOOT, dir:-1, type:s.type,
    hp: ENEMIES[s.type].hp, maxHp: ENEMIES[s.type].hp,
    patrol:[(s.c-3)*TS, (s.c+3)*TS], stunMs:0, dead:false, flashMs:0,
  }));
  const citizens = p.spawns.citizens.map((s,i)=>({
    x: s.c*TS, y: surfaceTop(s.c, s.r) - 22, dir: i%2?1:-1, clr:'#ffd8a8', npc: NPC_TYPES[i % NPC_TYPES.length],
    saved:false, eaten:false, eatenTimer:0, savedTimer:0, particles:[],
  }));
  const ps = p.spawns.player || { r:7, c:2 };
  return { tiles:p.tiles, food, enemies, citizens,
           playerSpawn:{ x:ps.c*TS, y:ps.r*TS }, exit:p.spawns.exit, LW:p.LW, LH:p.LH };
}

// ═══════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════
let scene = 'select'; // select|playing|victory|gameover|overworld
let selIdx = 0;
let owIdx = 0; // highlighted node in the overworld
const SEL_CHARS = ['lulah','poppy'];
let state = null;
let lastResult = null; // populated by finishLevel(), shown on the victory screen

// ── Persistent meta-progression (Spirit Orbs, growth stage, per-level stars) ──
let meta = Progression.deserializeMeta(
  (typeof localStorage !== 'undefined') ? localStorage.getItem('kaiju_meta') : null);
function saveMeta(){
  try { localStorage.setItem('kaiju_meta', Progression.serializeMeta(meta)); } catch (e) {}
}

function mkState(charKey, levelId){
  const build = (LEVEL_BUILDERS[levelId] || LEVEL_BUILDERS.w1l1)();
  return {
    charKey,
    levelId,
    player: {
      x: (build.playerSpawn ? build.playerSpawn.x : 2*TS),
      y: (build.playerSpawn ? build.playerSpawn.y : 7*TS),
      vx:0, vy:0,
      onGround:false,
      dir:1,
      hp: charKey==='poppy' ? 80 : 100,
      maxHp: charKey==='poppy' ? 80 : 100,
      fartMeter:0,
      invincMs:0,
      eatAnim:0,
      fartAnim:0,
      jumpPressed:false,
    },
    level:    build,
    cam:      { x:0, y:0 },
    score:    0,
    savedCitizens: 0,
    lostCitizens:  0,
    hitsTaken: 0,
    startTick: 0,
    msgs:     [],
    dmgNums:  [],
    fartCloud:null,
    tick:     0,
  };
}

function finishLevel(){
  if(scene==='victory') return; // already finished
  const s = state;
  const total = s.level.citizens.length;
  const timeSec = Math.max(0, Math.round((tick - s.startTick)/60));
  const rank = Progression.computeRank({
    timeSec, hitsTaken: s.hitsTaken, citizensSaved: s.savedCitizens, citizensTotal: total,
  });
  const before = meta.orbs;
  meta = Progression.applyResult(meta, {
    levelId: s.levelId, rank, citizensSaved: s.savedCitizens, citizensTotal: total, sideQuestsDone: 0,
  });
  saveMeta();
  lastResult = {
    rank,
    orbsEarned: meta.orbs - before,
    stars: meta.levels[s.levelId].stars,
    timeSec,
    saved: s.savedCitizens,
    total,
  };
  scene='victory'; sndVictory();
}

// ═══════════════════════════════════════════
//  TILE HELPERS
// ═══════════════════════════════════════════
function tile(t,r,c){
  if(r<0||r>=LH||c<0||c>=LW) return r>=LH?T_SOLID:T_AIR;
  return t[r][c];
}
function solid(t,r,c){ const v=tile(t,r,c); return v===T_SOLID||v===T_DEST; }
function plat(t,r,c){  return tile(t,r,c)===T_PLAT; }

// ═══════════════════════════════════════════
//  PHYSICS / PLAYER UPDATE
// ═══════════════════════════════════════════
function updatePlayer(dt, s){
  const pl = s.player;
  const tiles = s.level.tiles;
  const PW=44, PH=66;  // player bounding box

  pl.invincMs    = Math.max(0, pl.invincMs  - dt);
  pl.eatAnim     = Math.max(0, pl.eatAnim   - dt);
  pl.fartAnim    = Math.max(0, pl.fartAnim  - dt);
  pl.biteCooldown= Math.max(0, (pl.biteCooldown||0) - dt);

  // ── Input
  const spd = s.charKey==='poppy' ? 2.9 : 2.3;
  if(isMoveL()){ pl.vx=-spd; pl.dir=-1; }
  else if(isMoveR()){ pl.vx=spd; pl.dir=1; }
  else { pl.vx *= 0.60; if(Math.abs(pl.vx)<0.35) pl.vx=0; }

  // ── Jump
  const jumpNow = isJump();
  if(jumpNow && !pl.jumpPressed && pl.onGround){
    pl.vy = s.charKey==='poppy' ? -10.5 : -9.0;
    pl.onGround = false;
    sndJump();
  }
  pl.jumpPressed = jumpNow;

  // ── Drop through platform
  if(isDown('ArrowDown','KeyS') && pl.onGround){ pl.y+=4; pl.onGround=false; }

  // ── Attack (Z/X): bite when no meter, fart when charged
  if(isFart()){
    if(pl.fartMeter >= 20) doFart(s);
    else doBite(s);
  }

  // ── Gravity
  if(!pl.onGround){ pl.vy = Math.min(pl.vy+GRAV, MAXVY); }

  // ── Move X
  pl.x += pl.vx;
  resolveX(pl, tiles, PW, PH);

  // ── Move Y
  pl.y += pl.vy;
  pl.onGround = false;
  resolveY(pl, tiles, PW, PH);

  // ── Spikes / hazards: damage if the player's box overlaps a hazard tile ──
  if((pl.invincMs||0) <= 0){
    const c0 = Math.floor(pl.x / TS), c1 = Math.floor((pl.x+PW) / TS);
    const r0 = Math.floor(pl.y / TS), r1 = Math.floor((pl.y+PH) / TS);
    let onHazard = false;
    for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(tile(tiles,r,c)===T_HAZARD) onHazard=true;
    if(onHazard){
      pl.hp = Math.max(0, pl.hp - 12);
      pl.invincMs = 1000;
      s.hitsTaken++;
      pl.vy = -6;                     // small knock-up
      addShake(5, 180);
    }
  }

  // ── Bounds
  pl.x = Math.max(0, Math.min(LW*TS - PW, pl.x));
  if(pl.y > LH*TS+60){ pl.hp=0; }

  // ── Camera
  const tx = pl.x + PW/2 - VW/2;
  s.cam.x += (tx - s.cam.x) * 0.11;
  s.cam.x = Math.max(0, Math.min(LW*TS - VW, s.cam.x));
  // Vertical follow: keep the player ~55% down the screen; clamp to level height.
  const tyc = pl.y - VH*0.55;
  s.cam.y += (tyc - s.cam.y) * 0.11;
  s.cam.y = Math.max(0, Math.min(Math.max(0, LH*TS - VH), s.cam.y));

  // ── Stomp enemies from above
  if(pl.vy > 0 && state){
    const PW=44, PH=66;
    state.level.enemies.forEach(e=>{
      if(e.dead || e.stunMs>0) return;
      const ew=eW(e), eh=eH(e);
      const prevFeet = pl.y+PH - pl.vy;
      const eFeetTop = e.y;
      if(pl.x+PW-6 > e.x && pl.x+6 < e.x+ew &&
         prevFeet <= eFeetTop+4 && pl.y+PH >= eFeetTop){
        e.stunMs = 2500;
        e.hp -= 25;
        const stompScore = e.hp<=0 ? (enemyBig(e)?300:100) : 25;
        if(e.hp<=0){ e.dead=true; state.score+=stompScore; addShake(5,220); }
        else { addShake(3, 120); }
        pushNum(state, pl.x, pl.y, '-25', '#ff8844');
        pl.vy = -7;  // bounce
        sndJump();
        pushMsg(state, '👊 STOMP!', 700, '#ffee44', 'md');
        // Save nearby citizen
        state.level.citizens.forEach(c=>{
          if(c.saved||c.eaten) return;
          if(Math.abs(c.x - e.x) < 80){ saveCitizen(c, state); }
        });
      }
    });
  }

  // ── Win
  if(pl.x > (LW-3)*TS && scene==='playing'){
    finishLevel();
  }
}

function resolveX(pl, tiles, PW, PH){
  const dir = pl.vx > 0 ? 1 : -1;
  const checkX = pl.vx>0 ? pl.x+PW : pl.x;
  const col = Math.floor(checkX/TS);
  const r1  = Math.floor((pl.y+4)/TS);
  const r2  = Math.floor((pl.y+PH-4)/TS);
  for(const r of [r1,r2]){
    if(solid(tiles,r,col)){
      if(dir>0) pl.x=col*TS-PW; else pl.x=(col+1)*TS;
      pl.vx=0; break;
    }
  }
}

function resolveY(pl, tiles, PW, PH){
  const c1 = Math.floor((pl.x+4)/TS);
  const c2 = Math.floor((pl.x+PW-4)/TS);

  if(pl.vy >= 0){
    const feetRow = Math.floor((pl.y+PH)/TS);
    for(const c of [c1,c2]){
      if(solid(tiles,feetRow,c)){
        pl.y = feetRow*TS - PH; pl.vy=0; pl.onGround=true; break;
      }
      // One-way platform: only from above
      if(plat(tiles,feetRow,c) && pl.y+PH-pl.vy <= feetRow*TS){
        pl.y = feetRow*TS - PH; pl.vy=0; pl.onGround=true; break;
      }
    }
  } else if(pl.vy < 0){
    const headRow = Math.floor(pl.y/TS);
    for(const c of [c1,c2]){
      if(solid(tiles,headRow,c)){
        pl.y=(headRow+1)*TS; pl.vy=0; break;
      }
    }
  }
}

// ═══════════════════════════════════════════
//  FOOD / FART SYSTEM
// ═══════════════════════════════════════════
function updateFood(dt, s){
  const pl = s.player;
  const PW=44, PH=66;
  s.level.food.forEach(f=>{
    if(f.collected) return;
    // Collect when player overlaps
    if(pl.x < f.x+20 && pl.x+PW > f.x &&
       pl.y < f.y+20 && pl.y+PH > f.y){
      f.collected=true;
      sndChomp();
      pl.eatAnim = 400;
      // Poppy gets bonus on banana
      const bonus = (s.charKey==='poppy' && f.type.name==='BANANA') ? 1.4 : 1;
      pl.fartMeter = Math.min(100, pl.fartMeter + f.type.gain * bonus);
      s.score += 50;
      pushMsg(s, f.type.msg, 900, f.type.clr, 'md');
    }
  });
}

function saveCitizen(c, s){
  c.saved = true;
  c.savedTimer = 1200;
  s.savedCitizens++;
  s.score += 200;
  for(let i=0;i<8;i++) c.particles.push({
    vx:(Math.random()-0.5)*3, vy:-(Math.random()*3+1),
    life:800, maxLife:800,
    emoji:['💚','⭐','✨','💫'][i%4],
  });
  const total = s.level.citizens.length;
  if(s.savedCitizens >= total){ finishLevel(); }
}

function doBite(s){
  const pl = s.player;
  if((pl.biteCooldown||0) > 0) return;
  pl.biteCooldown = 900;
  pl.eatAnim = 420;
  sndRoar();
  const range = 90;
  const cx = pl.x + (pl.dir > 0 ? 44+20 : -20);
  let hit = false;
  s.level.enemies.forEach(e=>{
    if(e.dead) return;
    const ec = e.x + eW(e)/2;
    if(Math.abs(ec - cx) < range){
      e.hp -= 20; e.stunMs = 700; e.flashMs = 250;
      pushNum(s, e.x, e.y-10, '-20', '#ffee44');
      if(e.hp<=0){ e.dead=true; s.score+=enemyBig(e)?200:80; addShake(4,150); }
      else addShake(2,80);
      hit = true;
      // Save adjacent citizen
      s.level.citizens.forEach(c=>{
        if(c.saved||c.eaten) return;
        if(Math.abs(c.x - e.x) < 60) saveCitizen(c, s);
      });
    }
  });
  pushMsg(s, hit?'💥 CHOMP!':'🦖 ROAR!', 600, hit?'#ffee44':'#aaffaa', 'md');
}

function doFart(s){
  const pl = s.player;
  const size = pl.fartMeter >= 80 ? 3 : pl.fartMeter >= 50 ? 2 : 1;
  pl.fartAnim = [0,500,1000,2500][size];
  const saying = FART_SAYINGS[Math.floor(Math.random()*FART_SAYINGS.length)];
  pushMsg(s, saying, [0,1200,1800,3000][size], ['','#88ffaa','#44ff88','#00ff66'][size], 'lg');
  sndFart(size); sndGiggle();

  const radius = [0,80,160,260][size];
  s.fartCloud = { x:pl.x+22, y:pl.y+50, r:0, maxR:radius, size, timer:[0,600,1100,2600][size] };

  // Stun / kill enemies in radius — and rescue nearby citizens
  s.level.enemies.forEach(e=>{
    if(e.dead) return;
    const ex = e.x + (enemyBig(e)?14:8);
    const ey = e.y + (enemyBig(e)?9:19);
    const dx = ex - (pl.x+22), dy = ey - (pl.y+50);
    if(Math.sqrt(dx*dx+dy*dy) < radius){
      e.stunMs = [0,1500,3000,6000][size];
      const bigEnemy = enemyBig(e);
      const fartDmg = [0,15,30,99][size];
      if(size===3){ e.hp=0; e.dead=true; s.score+=bigEnemy?300:100; addShake(8,350); }
      else { e.hp -= fartDmg; if(e.hp<=0){ e.dead=true; s.score+=bigEnemy?300:100; addShake(5,200); } else addShake(3,120); }
      pushNum(s, e.x, e.y-10, '-'+fartDmg, '#44ff88');
      // Save citizens near this enemy
      s.level.citizens.forEach(c=>{
        if(c.saved||c.eaten) return;
        if(Math.abs(c.x - e.x) < 90) saveCitizen(c, s);
      });
    }
  });

  pl.fartMeter = Math.max(0, pl.fartMeter - [0,30,55,100][size]);
}

function updateFartCloud(dt, s){
  if(!s.fartCloud) return;
  const fc = s.fartCloud;
  fc.timer -= dt;
  fc.r = Math.min(fc.maxR, fc.r + dt * 0.22);
  if(fc.timer <= 0) s.fartCloud = null;
}

function updateEnemies(dt, s){
  const pl = s.player;
  const PW=44, PH=66;
  s.level.enemies.forEach(e=>{
    if(e.dead) return;
    e.flashMs = Math.max(0, (e.flashMs||0)-dt);
    e.stunMs  = Math.max(0, e.stunMs-dt);
    if(e.stunMs > 0) return;  // stunned, don't move

    const spd = enemyBig(e) ? 0.5 : 0.9;
    // Face player direction & patrol
    e.x += spd * e.dir;
    if(e.x <= e.patrol[0]){ e.x=e.patrol[0]; e.dir=1; }
    if(e.x+eW(e) >= e.patrol[1]){ e.x=e.patrol[1]-eW(e); e.dir=-1; }

    // Hurt player on contact
    if(pl.invincMs<=0){
      const ex=e.x, ey=e.y, ew=eW(e), eh=eH(e);
      if(pl.x<ex+ew && pl.x+PW>ex && pl.y<ey+eh && pl.y+PH>ey){
        pl.hp = Math.max(0, pl.hp-12);
        s.hitsTaken++;
        pl.invincMs = 1400;
        pl.vx = pl.x < ex ? -5 : 5;
        pl.vy = -4;
        addShake(4, 180);
        pushNum(s, pl.x, pl.y-20, '-12', '#ff3333');
        sndHurt();
      }
    }
  });
}

function updateCitizens(dt, s){
  s.level.citizens.forEach(c=>{
    c.eatenTimer = Math.max(0, c.eatenTimer - dt);
    c.savedTimer = Math.max(0, c.savedTimer - dt);
    c.particles = c.particles.filter(p=>{
      p.life -= dt; p.x = (p.x||0) + p.vx; p.y = (p.y||0) + p.vy; p.vy += 0.05;
      return p.life > 0;
    });
    if(c.saved || c.eaten) return;

    // Run away from nearest active enemy
    let nearestDist = Infinity, nearestDx = 0;
    s.level.enemies.forEach(e=>{
      if(e.dead) return;
      const dx = e.x - c.x;
      const d = Math.abs(dx);
      if(d < nearestDist){ nearestDist=d; nearestDx=dx; }
    });
    const panic = nearestDist < 180;
    // Only turn when the threat is clearly to one side; a per-frame flip made
    // cornered citizens vibrate (gyrate) in place and mirror their sprite every frame.
    if(panic && Math.abs(nearestDx) > 24) c.dir = nearestDx > 0 ? -1 : 1;
    const spd = panic ? 1.5 : 0.7;
    const nx  = c.x + c.dir * spd;
    const lo = TS, hi = (LW-2)*TS;
    // If fleeing into a wall, hold still instead of jittering against the clamp.
    if(nx > lo && nx < hi) c.x = nx;

    // Enemy catches citizen
    s.level.enemies.forEach(e=>{
      if(e.dead || e.stunMs>0 || c.eaten) return;
      // Must be at roughly the same height (vertical levels: ground enemy can't eat
      // a citizen on a rooftop just because they share an x column).
      if(Math.abs(e.x + eW(e)/2 - c.x) < 20 && Math.abs(e.y - c.y) < 40){
        c.eaten = true;
        c.eatenTimer = 600;
        s.lostCitizens++;
        pushMsg(s, '😱 CITIZEN EATEN!', 1400, '#ff4444', 'md');
        if(s.lostCitizens >= 3 && scene==='playing'){ scene='gameover'; }
      }
    });
  });
}

function eW(e){ return enemyBig(e)?36:20; }
function eH(e){ return enemyBig(e)?28:36; }

function pushMsg(s, text, ms, clr, size){
  s.msgs.push({ text, timer:ms, maxTimer:ms, clr:clr||'#ffffff', size:size||'sm' });
}
function pushNum(s, x, y, text, clr){
  s.dmgNums.push({ x, y, text, clr:clr||'#ffee44', life:800, maxLife:800 });
}

// ═══════════════════════════════════════════
//  BACKGROUND DRAWING
// ═══════════════════════════════════════════
function drawBg(cam){
  // ── Image backdrop (per world). Falls back to a flat day sky until the image loads. ──
  // World is derived from the active level id (w<N>l<M>); only World 1 art exists for now.
  const world = (state && state.levelId) ? state.levelId.charAt(1) : '1';
  const bgImg = loadedSprites['bg_w' + world];
  if(bgImg){
    const pf = 0.35;                       // parallax: backdrop drifts slower than camera
    let ox = (cam.x * pf) % VW;
    if(ox < 0) ox += VW;
    // Vertical parallax: the backdrop is drawn taller than the viewport and pans with
    // cam.y, so climbing reveals more sky up top and the street stays at the bottom.
    const drawH = VH * 1.5;
    const camYMax = Math.max(1, LH*TS - VH);
    const oy = -((cam.y / camYMax) * (drawH - VH));   // 0 (sky) at top, -(drawH-VH) (street) at bottom
    ctx.drawImage(bgImg, -ox, oy, VW, drawH);
    ctx.drawImage(bgImg, VW - ox, oy, VW, drawH);
    // Graduated scrim over the play band so foreground sprites read clearly against
    // the busy street-level art — darkest at the very bottom, fading out by mid-screen.
    const scrim = ctx.createLinearGradient(0, VH - 170, 0, VH);
    scrim.addColorStop(0,    'rgba(8,12,28,0)');
    scrim.addColorStop(0.55, 'rgba(8,12,28,0.32)');
    scrim.addColorStop(1,    'rgba(8,12,28,0.52)');
    ctx.fillStyle = scrim; ctx.fillRect(0, VH - 170, VW, 170);
    return;
  }

  // ── Loading fallback: flat day sky (only until the world backdrop image loads) ──
  const sky = ctx.createLinearGradient(0,0,0,VH);
  sky.addColorStop(0,'#7ec8f0'); sky.addColorStop(1,'#cfeaff');
  ctx.fillStyle=sky; ctx.fillRect(0,0,VW,VH);
}

function bgLayer(offset, bldClr, roofClr, maxH, maxW, winAlpha){
  const seed=[0,55,130,190,265,330,400,468,540,610,680,750];
  seed.forEach((bx,i)=>{
    const h = maxH*(0.6+((bx*7+i*13)%100)/250);
    const w = maxW*(0.7+((bx*3+i*11)%100)/300);
    const wx = ~~(((bx-offset)%(VW+maxW)+VW+maxW)%(VW+maxW)-maxW);
    ctx.fillStyle=bldClr; ctx.fillRect(wx, VH-h, w, h);
    ctx.fillStyle=roofClr; ctx.fillRect(wx, VH-h, w, 3);  // roofline
    ctx.fillStyle=`rgba(255,210,120,${winAlpha})`;
    const cols=Math.floor(w/9), rows=3;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if((r*cols+c+i)%3!==0) ctx.fillRect(wx+2+c*8, VH-h+5+r*10, 4, 5);
    }
  });
}
// ═══════════════════════════════════════════
//  TILE DRAWING
// ═══════════════════════════════════════════
function drawTiles(s){
  const cam = s.cam;
  const tiles = s.level.tiles;
  const sc = Math.floor(cam.x/TS)-1;
  const ec = Math.min(LW, sc + Math.floor(VW/TS)+3);

  for(let r=0;r<LH;r++){
    for(let c=Math.max(0,sc);c<ec;c++){
      const t = tiles[r][c];
      if(t===T_AIR) continue;
      const px=~~(c*TS-cam.x), py=~~(r*TS-cam.y);

      if(t===T_SOLID){
        ctx.fillStyle='#6b5536'; ctx.fillRect(px,py,TS,TS);           // building wall
        ctx.fillStyle='#7d6440'; ctx.fillRect(px,py,TS,4);            // lit top edge
        ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(px,py+TS-4,TS,4);
        ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1; ctx.strokeRect(px+0.5,py+0.5,TS-1,TS-1);
      } else if(t===T_PLAT){
        ctx.fillStyle='#9a4a3a'; ctx.fillRect(px,py,TS,7);            // rooftop slab
        ctx.fillStyle='#bd5f49'; ctx.fillRect(px,py,TS,3);
        ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fillRect(px,py+7,TS,3);
      } else if(t===T_DEST){
        ctx.fillStyle='#a9762e'; ctx.fillRect(px+1,py+1,TS-2,TS-2);   // wooden crate
        ctx.strokeStyle='#6e4a18'; ctx.lineWidth=2; ctx.strokeRect(px+2,py+2,TS-4,TS-4);
        ctx.beginPath(); ctx.moveTo(px+2,py+2); ctx.lineTo(px+TS-2,py+TS-2);
        ctx.moveTo(px+TS-2,py+2); ctx.lineTo(px+2,py+TS-2); ctx.stroke();
      } else if(t===T_HAZARD){
        ctx.fillStyle='#3a3f4a'; ctx.fillRect(px,py+TS-6,TS,6);       // base
        ctx.fillStyle='#c8ccd4';                                      // metal spikes
        for(let k=0;k<4;k++){ const sx=px+k*8;
          ctx.beginPath(); ctx.moveTo(sx,py+TS-6); ctx.lineTo(sx+4,py+10); ctx.lineTo(sx+8,py+TS-6); ctx.fill(); }
      }
    }
  }
}

function drawFood(s){
  const t = Date.now()*0.003;
  const cam = s.cam;
  ctx.font='20px serif';
  ctx.textAlign='center';
  s.level.food.forEach((f,i)=>{
    if(f.collected) return;
    const fx=~~(f.x-cam.x+10), fy=~~(f.y-cam.y+Math.sin(t+f.bobOff)*4);
    // Glow ring
    ctx.fillStyle=f.type.clr+'33';
    ctx.beginPath();
    ctx.arc(fx, fy+10, 14+Math.sin(t+f.bobOff)*2, 0, Math.PI*2);
    ctx.fill();
    const img = loadedSprites['food_'+f.type.key];
    if(img){
      const SZ = 26;
      _drawSprite('food_'+f.type.key, fx - SZ/2, fy + 10 - SZ/2, SZ, SZ, 1, false);
    } else {
      ctx.fillText(f.type.emoji, fx, fy+15);   // fallback until sprite loads
    }
  });
  ctx.textAlign='left';
}

// ═══════════════════════════════════════════
//  ENEMY DRAWING
// ═══════════════════════════════════════════
function drawEnemies(s){
  s.level.enemies.forEach(e=>{
    if(e.dead) return;
    const ex=~~(e.x-s.cam.x), ey=~~(e.y-s.cam.y);
    const fl=(e.flashMs||0)>0;
    const st=e.stunMs>0;
    const dir=e.dir;

    drawEnemy(e, ex, ey, dir, fl, st);

    // HP bar
    if(e.hp<e.maxHp){
      const bw=enemyBig(e)?36:20;
      ctx.fillStyle='#1a0a0a'; ctx.fillRect(ex, ey-6, bw, 3);
      ctx.fillStyle=e.hp>e.maxHp*0.5?'#22cc22':'#cc4400';
      ctx.fillRect(ex, ey-6, Math.round(bw*e.hp/e.maxHp), 3);
    }

    // Stun stars
    if(st){
      ctx.font='10px serif'; ctx.textAlign='center';
      const bx=ex+(enemyBig(e)?18:10);
      for(let i=0;i<3;i++){
        const a=Date.now()*0.005+i*2.1;
        ctx.fillText('⭐', bx+Math.cos(a)*10, ey-14+Math.sin(a)*4);
      }
      ctx.textAlign='left';
    }
  });
}

function drawCitizens(s){
  const cam = s.cam;
  const t = Date.now();
  s.level.citizens.forEach(c=>{
    const cx2 = ~~(c.x - cam.x);
    const cy2 = ~~(c.y - cam.y);

    // Particle effects (saved sparkles)
    c.particles.forEach(p=>{
      const alpha2 = p.life/p.maxLife;
      ctx.globalAlpha = alpha2;
      ctx.font='10px serif'; ctx.textAlign='center';
      ctx.fillText(p.emoji, cx2+(p.x||0), cy2+(p.y||0));
    });
    ctx.globalAlpha=1; ctx.textAlign='left';

    if(c.eaten && c.eatenTimer>0){
      // Show poof when eaten
      ctx.font='16px serif'; ctx.textAlign='center';
      ctx.globalAlpha = c.eatenTimer/600;
      ctx.fillText('💀', cx2, cy2-8);
      ctx.globalAlpha=1; ctx.textAlign='left';
      return;
    }
    if(c.saved){
      if(c.savedTimer>0){
        ctx.font='16px serif'; ctx.textAlign='center';
        ctx.globalAlpha = c.savedTimer/1200;
        ctx.fillText('🎉', cx2, cy2-16);
        ctx.globalAlpha=1; ctx.textAlign='left';
      }
      return;
    }

    // Fleeing citizen — one of the 8 named townsfolk (NPC sprite), bobbing as it runs.
    const bob  = Math.sin(t*0.015 + c.x*0.01) * 2;
    const flip = c.dir < 0;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx2, cy2+20, 9, 3, 0, 0, Math.PI*2); ctx.fill();
    const npcKey = 'npc_' + (c.npc || 'salaryman');
    const img = loadedSprites[npcKey];
    if(img){
      const NH = 34;                                    // in-game citizen height
      const NW = NH * (img.naturalWidth / img.naturalHeight);
      _drawSprite(npcKey, cx2 - NW/2, cy2 + 22 - NH + bob, NW, NH, flip ? -1 : 1, false);
    } else {
      ctx.fillStyle = c.clr || '#ffd8a8';               // fallback until sprite loads
      ctx.fillRect(cx2-6, cy2+bob, 12, 18);
    }

    // "HELP!" bubble above
    const nearDist = s.level.enemies.reduce((mn,e)=>e.dead?mn:Math.min(mn,Math.abs(e.x-c.x)), Infinity);
    if(nearDist < 140){
      const bubbleAlpha = Math.min(1, (140-nearDist)/80);
      ctx.globalAlpha=bubbleAlpha;
      ctx.fillStyle='white'; ctx.strokeStyle='#cc2200'; ctx.lineWidth=1;
      ctx.fillRect(cx2-18, cy2-38, 36, 14);
      ctx.strokeRect(cx2-18, cy2-38, 36, 14);
      ctx.fillStyle='#cc2200'; ctx.font='bold 7px monospace'; ctx.textAlign='center';
      ctx.fillText('HELP! 😱', cx2, cy2-27);
      ctx.globalAlpha=1; ctx.textAlign='left';
    }
  });
}

function _kaijuKey(char, pl, tick){
  if(pl.eatAnim>0)  return char+'_eat_'+(Math.floor(tick/6)%2+1);
  if(pl.fartAnim>0) return char+'_fart_'+(Math.floor(tick/8)%2+1);
  if(!pl.onGround)  return char+'_jump';
  if(Math.abs(pl.vx)>0.3) return char+'_walk_'+(Math.floor(tick/8)%4+1);
  return char+'_idle';
}

function _drawSprite(key, x, y, w, h, dir, flash){
  const img = loadedSprites[key]; if(!img) return;
  x=Math.round(x); y=Math.round(y);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if(dir<0){ ctx.translate(x+w,y); ctx.scale(-1,1); ctx.drawImage(img,0,0,w,h); }
  else       ctx.drawImage(img,x,y,w,h);
  ctx.restore();
  if(flash){
    ctx.save(); ctx.globalAlpha=0.55; ctx.fillStyle='#ffffff';
    ctx.fillRect(x,y,w,h); ctx.restore();
  }
}

// Generic enemy draw: looks up the ENEMIES registry, scales with the hero's
// growth stage (so enemies grow as the heroes grow), and anchors the sprite at
// the feet (spawn ground line is 38px below e.y). x,y are screen coords.
const ENEMY_FOOT = 38;
function drawEnemy(e, x, y, dir, flash, stun){
  const def = ENEMIES[e.type] || ENEMIES.slime;
  const key = 'en_' + (ENEMIES[e.type] ? e.type : 'slime');
  const sc  = _kaijuScale();                 // same growth curve as the heroes
  const sw  = def.w * sc, sh = def.h * sc;
  const cx  = x + (enemyBig(e) ? 18 : 10);    // horizontal centre over the hitbox
  const dx  = cx - sw/2;
  const dy  = (y + ENEMY_FOOT) - sh;          // feet planted on the ground line
  _drawSprite(key, dx, dy, sw, sh, dir, flash);
  if(stun){
    ctx.save(); ctx.globalAlpha=0.55; ctx.fillStyle='#ffaa00';
    ctx.fillRect(dx, dy, sw, sh); ctx.restore();
  }
}

// ═══════════════════════════════════════════
//  KAIJU SPRITES  (16-bit SNES style)
// ═══════════════════════════════════════════
// Physical growth: the kaiju visibly scales up with meta.growthStage
// (Hatchling → Apex). Sprite is anchored at the feet so it grows upward.
// Per-stage redesigned art (pink-frilled Lulah etc.) is a follow-on; this
// reuses the existing animation frames at a stage-driven scale.
const GROWTH_SCALE = [0.62, 0.78, 0.92, 1.12, 1.35];
function _kaijuScale(){ return GROWTH_SCALE[(meta && meta.growthStage) || 0] || 1; }
function _drawKaijuSprite(key, bx, by, dir){
  const img = loadedSprites[key];
  const h  = 64 * _kaijuScale();                 // drawn height (grows with the kaiju)
  // Keep the frame's real aspect — the SNES frames aren't square; forcing a square
  // both squished the hero and (with the old 64px anchor) floated it above the ground.
  const w  = img ? h * (img.naturalWidth / img.naturalHeight) : h;
  // Plant the feet on the hitbox bottom: by = screenY-4, hitbox is 66 tall -> by+70.
  _drawSprite(key, (bx + 32) - w/2, (by + 70) - h, w, h, dir, false);
}
function drawLulah(x, y, pl, tick){
  const invinc = (pl.invincMs||0)>0 && Math.floor(Date.now()/80)%2===0;
  if(invinc){ ctx.save(); ctx.globalAlpha=0.3; }
  _drawKaijuSprite(_kaijuKey('lulah',pl,tick), x-10, y-4, pl.dir);
  if(invinc) ctx.restore();
}
function drawPoppy(x, y, pl, tick){
  const invinc = (pl.invincMs||0)>0 && Math.floor(Date.now()/80)%2===0;
  if(invinc){ ctx.save(); ctx.globalAlpha=0.3; }
  _drawKaijuSprite(_kaijuKey('poppy',pl,tick), x-9, y-4, pl.dir);
  if(invinc) ctx.restore();
}
// ═══════════════════════════════════════════
//  FART CLOUD DRAWING
// ═══════════════════════════════════════════
function drawFartCloud(s){
  const fc = s.fartCloud;
  if(!fc) return;
  const prog = fc.timer / ([0,600,1100,2600][fc.size]);
  const alpha = Math.min(prog*2, 1) * 0.65;
  const cx = ~~(fc.x - s.cam.x);
  const cy = ~~(fc.y - s.cam.y);

  // Multi-ring expanding cloud
  for(let i=0;i<3;i++){
    const rp = (fc.r/fc.maxR) * (1-i*0.25);
    const cr = fc.r*(1-i*0.2);
    const clr = fc.size===3 ? `rgba(80,255,80,${alpha*(1-i*0.3)})` :
                fc.size===2 ? `rgba(120,220,80,${alpha*(1-i*0.3)})` :
                              `rgba(160,220,100,${alpha*(1-i*0.3)})`;
    ctx.strokeStyle=clr; ctx.lineWidth=fc.size*3-i*2;
    ctx.shadowColor=fc.size===3?'#22ff44':'#88cc44';
    ctx.shadowBlur=fc.size===3?18:8;
    ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.stroke();
  }
  ctx.shadowBlur=0;

  // Puff particles
  if(fc.size>=2){
    ctx.globalAlpha=alpha*0.4;
    ctx.fillStyle=fc.size===3?'#44ff66':'#88cc44';
    const t=Date.now()*0.002;
    for(let i=0;i<6;i++){
      const a=t*1.5+i*1.05;
      const pr=fc.r*0.7;
      ctx.beginPath();
      ctx.arc(cx+Math.cos(a)*pr, cy+Math.sin(a)*pr, 8+fc.size*3, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // Cute emoji particles floating in cloud
  ctx.globalAlpha = alpha * 0.9;
  const emojis = fc.size===3 ? ['💨','💚','⭐','🌟','💫','😝'] :
                 fc.size===2 ? ['💨','💚','⭐','😄'] : ['💨','💚'];
  const t2=Date.now()*0.001;
  for(let i=0;i<emojis.length;i++){
    const a2 = t2*0.8 + i*1.05;
    const er = fc.r*(0.3+i*0.12);
    const ex2 = cx + Math.cos(a2)*er;
    const ey2 = cy + Math.sin(a2)*er*0.6 - i*4;
    ctx.font=`${8+fc.size*4}px serif`;
    ctx.textAlign='center';
    ctx.fillText(emojis[i], ex2, ey2);
  }
  ctx.globalAlpha=1; ctx.textAlign='left';

  // BRRRAP text for big fart
  if(fc.size===3){
    ctx.font='bold 14px monospace'; ctx.textAlign='center';
    ctx.fillStyle=`rgba(100,255,100,${alpha*0.9})`;
    ctx.shadowColor='#44ff44'; ctx.shadowBlur=10;
    ctx.fillText('BRRRAAAP! 💨', cx, cy - fc.r*0.8);
    ctx.shadowBlur=0; ctx.textAlign='left';
  }

  // Squiggly lines for big fart
  if(fc.size===3){
    ctx.strokeStyle='rgba(100,255,100,0.5)';
    ctx.lineWidth=2;
    for(let i=0;i<4;i++){
      const a=i*1.57+Date.now()*0.001;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      for(let j=1;j<=8;j++){
        const r=fc.r*(j/8);
        ctx.lineTo(cx+Math.cos(a+j*0.4)*r, cy+Math.sin(a+j*0.3)*r);
      }
      ctx.stroke();
    }
  }
}

// ═══════════════════════════════════════════
//  HUD  (minimal — just what matters)
// ═══════════════════════════════════════════
function drawHUD(s){
  const pl = s.player;

  // ── HP bar (top left) ──
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(6,6,90,12);
  const hpClr = pl.hp>60?'#22cc22':pl.hp>30?'#cc9900':'#cc2200';
  ctx.fillStyle=hpClr; ctx.fillRect(7,7,Math.round(88*pl.hp/pl.maxHp),10);
  ctx.strokeStyle='#334433'; ctx.lineWidth=1; ctx.strokeRect(6,6,90,12);
  ctx.fillStyle=hpClr; ctx.font='bold 7px monospace';
  ctx.fillText('HP', 8, 5);

  // ── FART METER (center top, big and prominent) ──
  const fm = pl.fartMeter/100;
  const mW=180, mX=VW/2-mW/2, mY=5;
  // Background
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(mX-2,mY-2,mW+4,18);
  // Gradient fill
  const grad = ctx.createLinearGradient(mX,0,mX+mW,0);
  grad.addColorStop(0,'#336622'); grad.addColorStop(0.5,'#66cc22'); grad.addColorStop(1,fm>=0.8?'#22ff66':'#aaee44');
  ctx.fillStyle=grad; ctx.fillRect(mX,mY,Math.round(mW*fm),14);
  // Segmented ticks
  ctx.fillStyle='rgba(0,0,0,0.3)';
  for(let i=1;i<5;i++) ctx.fillRect(mX+mW*(i/5),mY,1,14);
  // Border (glows when ready)
  if(fm>=0.2){ ctx.shadowColor='#44ff44'; ctx.shadowBlur=8; }
  ctx.strokeStyle=fm>=0.2?'#44cc44':'#224422'; ctx.lineWidth=1;
  ctx.strokeRect(mX-2,mY-2,mW+4,18); ctx.shadowBlur=0;
  // Label
  ctx.textAlign='center'; ctx.font='bold 8px monospace';
  ctx.fillStyle = fm>=0.2 ? '#aaffaa' : '#446644';
  const fartLbl = fm>=1?'💨 MEGA FART READY! [Z]': fm>=0.5?'💨 FART [Z]': fm>=0.2?'💨 MINI FART [Z]':'🦖 CHOMP [Z]  •  eat food to charge fart!';
  ctx.fillText(fartLbl, VW/2, mY-1);
  ctx.textAlign='left';

  // ── Citizen rescue counter (top right) ──
  const total = s.level.citizens.length;
  const saved = s.savedCitizens;
  const lost  = s.lostCitizens;
  ctx.textAlign='right';
  ctx.font='bold 8px monospace';
  ctx.fillStyle='#22ffaa';
  ctx.fillText('👥 SAVED: '+saved+'/'+total, VW-6, 12);
  if(lost>0){
    ctx.fillStyle='#ff4444';
    ctx.fillText('💀 LOST: '+lost+'/3', VW-6, 24);
  }
  // Score
  ctx.fillStyle='#ffdd44'; ctx.fillText('★ '+s.score, VW-6, lost>0?36:24);
  ctx.textAlign='left';

  // ── Stomp hint (first time only) ──
  if(!s._stompHinted && s.player.onGround && s.level.enemies.some(e=>!e.dead)){
    s._stompHinted=true;
  }

  // ── Floating messages ──
  s.msgs.forEach(m=>{
    const prog = m.timer/m.maxTimer;
    const alpha = Math.min(prog*3, 1);
    ctx.globalAlpha=alpha;
    ctx.textAlign='center';
    const fs = m.size==='lg'?16:m.size==='md'?11:8;
    ctx.font=`bold ${fs}px monospace`;
    ctx.fillStyle=m.clr||'#ffffff';
    ctx.shadowColor=m.clr||'#ffffff'; ctx.shadowBlur=m.size==='lg'?12:4;
    ctx.fillText(m.text, VW/2, m.size==='lg'?VH*0.38:VH*0.28);
    ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textAlign='left';
  });

  // ── Floating damage numbers ──
  s.dmgNums.forEach(n=>{
    const nx = ~~(n.x - s.cam.x);
    const alpha = n.life/n.maxLife;
    ctx.globalAlpha = alpha;
    ctx.textAlign='center'; ctx.font='bold 9px monospace';
    ctx.fillStyle = n.clr;
    ctx.shadowColor = n.clr; ctx.shadowBlur = 4;
    ctx.fillText(n.text, nx, ~~n.y);
    ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textAlign='left';
  });

  // ── Controls hint (bottom, subtle) ──
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,VH-11,VW,11);
  ctx.fillStyle='#2a3a4a'; ctx.font='5px monospace';
  ctx.fillText('[← →] MOVE   [↑/SPACE] JUMP & STOMP from above   [Z/X] CHOMP nearby / FART when charged   👥 SAVE CITIZENS!', 4, VH-3);

  // ── Growth stage + orb readout (bottom right) ──
  ctx.save();
  ctx.textAlign='right'; ctx.font='12px monospace'; ctx.fillStyle='#7CD7FF';
  ctx.fillText('◈ '+meta.orbs+'  '+(Progression.GROWTH_STAGES[meta.growthStage]||Progression.GROWTH_STAGES[0]).name, VW-12, VH-16);
  ctx.restore();
}

// ═══════════════════════════════════════════
//  CHARACTER SELECT SCREEN
// ═══════════════════════════════════════════
function drawSelect(){
  // Rich background
  const sky = ctx.createLinearGradient(0,0,0,VH);
  sky.addColorStop(0,'#030812'); sky.addColorStop(1,'#0a1830');
  ctx.fillStyle=sky; ctx.fillRect(0,0,VW,VH);
  bgLayer(0,'#0c1520','#111a28',50,45,0.04);

  // Stars
  ctx.fillStyle='rgba(255,255,255,0.6)';
  [[40,12],[120,8],[210,18],[340,5],[460,14],[540,9]].forEach(([x,y])=>ctx.fillRect(x,y,1,1));

  const t = Date.now();

  // Title
  ctx.textAlign='center';
  ctx.font='bold 26px monospace';
  ctx.fillStyle='#22ffaa'; ctx.shadowColor='#22ffaa'; ctx.shadowBlur=18;
  ctx.fillText('KAIJU CHOMP', VW/2, 36);
  ctx.shadowBlur=0;
  ctx.font='8px monospace'; ctx.fillStyle='#558866';
  ctx.fillText('EAT FOOD. BUILD PRESSURE. UNLEASH.', VW/2, 50);
  ctx.font='7px monospace'; ctx.fillStyle='#336644';
  ctx.fillText('SELECT YOUR KAIJU', VW/2, 62);

  // Character cards
  const CARD_W=230, CARD_H=230;
  const cards=[{key:'lulah',cx:160},{key:'poppy',cx:480}];

  cards.forEach(({key,cx},idx)=>{
    const sel = idx===selIdx;
    const cd_name = key==='lulah'?'LULAH':'POPPY';
    const cd_sub  = key==='lulah'?'ATOMIC BABY':'WILD CHILD';
    const cd_clr  = key==='lulah'?'#22ffaa':'#ffaa22';
    const stats   = key==='lulah'
      ? ['❤️  HP: 100   🛡️ TANKY','🔥 ATOMIC BREATH RANGE','💨 SPICY FART (bigger = better)']
      : ['❤️  HP: 80    ⚡ SPEEDY','🌿 HIGHER JUMP + DASH','💨 BANANA FART (extra on 🍌)'];

    const pulse = Math.sin(t*0.003+idx)*3;
    const cardX = cx - CARD_W/2;
    const cardY = 76;

    // Card background
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.fillRect(cardX, cardY, CARD_W, CARD_H);
    ctx.strokeStyle=sel?cd_clr:'#1a2838';
    ctx.lineWidth=sel?2:1;
    if(sel){ ctx.shadowColor=cd_clr; ctx.shadowBlur=14; }
    ctx.strokeRect(cardX,cardY,CARD_W,CARD_H);
    ctx.shadowBlur=0;

    // Selected highlight
    if(sel){
      ctx.fillStyle=cd_clr+'18';
      ctx.fillRect(cardX+1,cardY+1,CARD_W-2,CARD_H-2);
    }

    // Draw character preview (centered in card top half)
    const SPW=120, SPH=120;
    const preImg = loadedSprites[key+'_idle'];
    if(preImg){ ctx.imageSmoothingEnabled=false; ctx.drawImage(preImg, cx-SPW/2, cardY+28+pulse, SPW, SPH); }

    // Name
    ctx.textAlign='center';
    ctx.font=`bold 13px monospace`; ctx.fillStyle=sel?cd_clr:'#6688aa';
    ctx.shadowColor=sel?cd_clr:'transparent'; ctx.shadowBlur=sel?8:0;
    ctx.fillText(cd_name, cx, cardY+170);
    ctx.shadowBlur=0;
    ctx.font='7px monospace'; ctx.fillStyle='#445566';
    ctx.fillText(cd_sub, cx, cardY+183);

    // Stats
    ctx.font='6px monospace'; ctx.fillStyle=sel?'#889aaa':'#445566';
    stats.forEach((line,i)=> ctx.fillText(line, cx, cardY+197+i*11));
  });

  // Selector arrow
  const selCard = cards[selIdx];
  ctx.fillStyle='#22ffaa'; ctx.shadowColor='#22ffaa'; ctx.shadowBlur=8;
  ctx.font='bold 14px monospace';
  ctx.fillText('▲', selCard.cx, 316);
  ctx.shadowBlur=0;

  // Controls
  ctx.font='bold 7px monospace'; ctx.fillStyle='#aabbcc';
  ctx.fillText('[← →] SELECT    [ENTER / Z] START', VW/2, 338);
  ctx.font='6px monospace'; ctx.fillStyle='#445566';
  ctx.fillText('1 PLAYER · TOKYO CITY · LEVEL 1', VW/2, 352);
  ctx.textAlign='left';
}

// ═══════════════════════════════════════════
//  TOUCH CONTROLS  (drawn over gameplay)
// ═══════════════════════════════════════════
// rounded-rect path helper (works ctx.roundRect isn't available)
function rrect(x, y, w, h, r){
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return; }
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function drawTouchControls(){
  if(!('ontouchstart' in window)) return;

  // Portrait overlay — show rotate hint but still allow play
  const isPortrait = window.innerHeight > window.innerWidth * 1.15;
  if(isPortrait){
    ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,VW,VH);
    ctx.textAlign='center';
    ctx.font='bold 22px monospace'; ctx.fillStyle='#22ffaa';
    ctx.fillText('📱 ROTATE YOUR PHONE', VW/2, VH/2-16);
    ctx.font='10px monospace'; ctx.fillStyle='#446644';
    ctx.fillText('landscape = best kaiju experience', VW/2, VH/2+12);
    ctx.textAlign='left';
    return;
  }

  const BS = 68, PAD = 10, GAP = 8;
  const Y  = VH - BS - PAD;

  // Left side: ◀ ▶
  BTNS.left  = {x: PAD,           y: Y, w: BS, h: BS};
  BTNS.right = {x: PAD+BS+GAP,    y: Y, w: BS, h: BS};
  // Right side: 💨 ▲
  BTNS.fart  = {x: VW-PAD-BS*2-GAP, y: Y, w: BS, h: BS};
  BTNS.jump  = {x: VW-PAD-BS,       y: Y, w: BS, h: BS};

  const drawBtn = (b, active, emoji, label, fill, glow)=>{
    ctx.save();
    // shadow glow when active
    if(active){ ctx.shadowColor=glow; ctx.shadowBlur=14; }
    // background
    ctx.globalAlpha = active ? 0.80 : 0.38;
    ctx.fillStyle = active ? fill : 'rgba(40,50,70,0.9)';
    rrect(b.x, b.y, b.w, b.h, 14); ctx.fill();
    // border
    ctx.globalAlpha = active ? 1 : 0.55;
    ctx.strokeStyle = active ? glow : 'rgba(100,130,160,0.7)';
    ctx.lineWidth = active ? 2.5 : 1.5;
    rrect(b.x, b.y, b.w, b.h, 14); ctx.stroke();
    // emoji / icon
    ctx.globalAlpha = 1; ctx.shadowBlur=0;
    ctx.textAlign='center';
    ctx.font=`${emoji?'22':'16'}px monospace`;
    ctx.fillStyle = active ? '#ffffff' : 'rgba(200,220,255,0.85)';
    ctx.fillText(emoji||label, b.x+b.w/2, b.y + (emoji?b.h*0.58:b.h*0.62));
    if(emoji && label){
      ctx.font='7px monospace'; ctx.fillStyle='rgba(255,255,255,0.55)';
      ctx.fillText(label, b.x+b.w/2, b.y+b.h-6);
    }
    ctx.textAlign='left'; ctx.restore();
  };

  drawBtn(BTNS.left,  touchInBtn('left'),  '◀', 'LEFT',  'rgba(80,120,220,0.9)',  '#88aaff');
  drawBtn(BTNS.right, touchInBtn('right'), '▶', 'RIGHT', 'rgba(80,120,220,0.9)',  '#88aaff');
  drawBtn(BTNS.fart,  touchInBtn('fart'),  '💨', 'ATK',   'rgba(40,200,100,0.9)', '#44ff88');
  drawBtn(BTNS.jump,  touchInBtn('jump'),  '▲', 'JUMP',  'rgba(220,150,40,0.9)', '#ffcc44');
}

// ═══════════════════════════════════════════
//  WIN / LOSE
// ═══════════════════════════════════════════
function drawVictory(){
  ctx.fillStyle='rgba(8,4,20,0.78)'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';
  ctx.fillStyle='#7CFF8A'; ctx.font='bold 34px monospace';
  ctx.fillText('LEVEL CLEAR!', VW/2, VH/2-90);
  if(lastResult){
    ctx.fillStyle='#ffd84a'; ctx.font='bold 72px monospace';
    ctx.fillText('RANK '+lastResult.rank, VW/2, VH/2-18);
    ctx.fillStyle='#fff'; ctx.font='16px monospace';
    ctx.fillText('★'.repeat(lastResult.stars)+'☆'.repeat(3-lastResult.stars), VW/2, VH/2+14);
    ctx.fillText('Citizens saved: '+lastResult.saved+' / '+lastResult.total, VW/2, VH/2+40);
    ctx.fillText('Time: '+lastResult.timeSec+'s', VW/2, VH/2+62);
    ctx.fillStyle='#7CD7FF';
    ctx.fillText('+'+lastResult.orbsEarned+' Spirit Orbs  (total '+meta.orbs+')', VW/2, VH/2+88);
  }
  ctx.fillStyle='#cfc6e6'; ctx.font='13px monospace';
  ctx.fillText('Press Space / tap to continue', VW/2, VH-30);
  ctx.textAlign='left';
}

function drawGameover(){
  ctx.fillStyle='rgba(20,0,0,0.86)'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';
  ctx.font='bold 28px monospace'; ctx.fillStyle='#cc2200';
  ctx.shadowColor='#cc2200'; ctx.shadowBlur=18;
  ctx.fillText('GAME OVER', VW/2, VH/2-30);
  ctx.shadowBlur=0;
  ctx.font='bold 10px monospace'; ctx.fillStyle='#cc8844';
  ctx.fillText('SCORE: ' + (state?state.score:0), VW/2, VH/2);
  ctx.font='8px monospace'; ctx.fillStyle='#884422';
  ctx.fillText('EAT FOOD · FART ON MONSTERS · STOMP THEM!', VW/2, VH/2+20);
  ctx.fillStyle='#664444';
  ctx.fillText('PRESS SPACE / ENTER  or  TAP TO RETURN', VW/2, VH/2+42);
  ctx.textAlign='left';

  if(wasDown('Space','Enter','ArrowUp','KeyW') || _lastTouchCount>0){
    scene='overworld';
  }
  _lastTouchCount = Object.keys(touches).length;
}

// ═══════════════════════════════════════════
//  MAIN UPDATE
// ═══════════════════════════════════════════
let tick = 0;

function update(dt){
  if(scene!=='playing' || !state) return;
  const s = state;
  tick++;

  updatePlayer(dt, s);
  updateFood(dt, s);
  updateFartCloud(dt, s);
  updateEnemies(dt, s);
  updateCitizens(dt, s);

  // Decay messages + damage numbers
  s.msgs = s.msgs.filter(m=>{ m.timer-=dt; return m.timer>0; });
  s.dmgNums = s.dmgNums.filter(n=>{ n.life-=dt; n.y-=0.6; return n.life>0; });

  // Decay screen shake
  if(_shakeMs>0){
    _shakeMs-=dt;
    _shakeX=(Math.random()-0.5)*_shakeAmt*2;
    _shakeY=(Math.random()-0.5)*_shakeAmt*2;
    if(_shakeMs<=0){ _shakeX=0; _shakeY=0; _shakeAmt=0; }
  }

  if(s.player.hp<=0 && scene==='playing') scene='gameover';
}

// ═══════════════════════════════════════════
//  MAIN RENDER
// ═══════════════════════════════════════════
function render(){
  ctx.clearRect(0,0,VW,VH);
  if(_shakeMs>0) ctx.save(), ctx.translate(_shakeX, _shakeY);
  ctx.font='8px monospace';

  if(scene==='overworld'){ updateOverworld(); }

  if(scene==='select'){
    // Keyboard input
    if(wasDown('ArrowLeft','KeyA'))  selIdx=(selIdx-1+SEL_CHARS.length)%SEL_CHARS.length;
    if(wasDown('ArrowRight','KeyD')) selIdx=(selIdx+1)%SEL_CHARS.length;
    if(wasDown('Enter','KeyZ','Space')){
      acResume();
      scene='overworld'; owIdx=0;
    }
    // Touch input — tap left/right half to select, tap again to start
    const rect2 = canvas.getBoundingClientRect();
    const freshTap = Object.keys(touches).length > 0 && !_lastTouchCount;
    if(freshTap && rect2.width){
      const scX2 = VW / rect2.width;
      const tx = (Object.values(touches)[0].x - rect2.left) * scX2;
      if(tx < VW/2) selIdx=0; else selIdx=1;
      acResume();
      scene='overworld'; owIdx=0;
    }
    _lastTouchCount = Object.keys(touches).length;
    drawSelect();
    return;
  }

  if(scene==='playing' && state){
    const s = state;
    const pl = s.player;
    const PW=44;

    drawBg(s.cam);
    drawTiles(s);
    drawFood(s);
    drawCitizens(s);
    drawFartCloud(s);
    drawEnemies(s);

    // Draw player character
    const px = ~~(pl.x - s.cam.x);
    const py = ~~(pl.y - s.cam.y);
    if(s.charKey==='lulah') drawLulah(px, py, pl, tick);
    else                    drawPoppy(px, py, pl, tick);

    // Exit portal at end of level
    const ex = ~~((LW-3)*TS - s.cam.x + TS/2);
    const t2 = Date.now()*0.003;
    ctx.shadowColor='#22ffaa'; ctx.shadowBlur=16+Math.sin(t2)*6;
    ctx.strokeStyle='#22ffaa'; ctx.lineWidth=3;
    ctx.strokeRect(ex-20, 8*TS-s.cam.y, 40, 2.5*TS);
    ctx.shadowBlur=0;
    ctx.textAlign='center'; ctx.font='bold 8px monospace'; ctx.fillStyle='#22ffaa';
    ctx.fillText('EXIT ▶', ex, 8*TS-s.cam.y-4); ctx.textAlign='left';

    drawHUD(s);
    drawTouchControls();
    return;
  }

  if(scene==='victory'){
    if(wasDown('Space','Enter','ArrowUp','KeyW') || _lastTouchCount>0){
      scene='overworld';
    }
    if(state) drawBg(state.cam); drawVictory();
  }
  if(scene==='gameover') { if(state) drawBg(state.cam); drawGameover(); }
  if(scene==='overworld'){ drawOverworld(); }
  if(_shakeMs>0) ctx.restore();
}

// ═══════════════════════════════════════════
//  OVERWORLD SCENE
// ═══════════════════════════════════════════
function updateOverworld(){
  const nodes = Progression.LEVELS;
  if(wasDown('ArrowRight','KeyD') || touchInBtn('right')) owIdx = Math.min(nodes.length-1, owIdx+1);
  if(wasDown('ArrowLeft','KeyA')  || touchInBtn('left'))  owIdx = Math.max(0, owIdx-1);
  const sel = nodes[owIdx];
  const unlocked = Progression.isLevelUnlocked(meta, sel.id);
  const freshTap = Object.keys(touches).length > 0 && !_lastTouchCount;
  if((isFart() || wasDown('Space','ArrowUp','KeyW','Enter') || (freshTap && touchInBtn('jump'))) && unlocked && sel.playable){
    state = mkState(SEL_CHARS[selIdx], sel.id);
    scene = 'playing';
    state.startTick = tick;
  }
  _lastTouchCount = Object.keys(touches).length;
}

function drawOverworld(){
  ctx.fillStyle='#1b1030'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';
  ctx.fillStyle='#ffd84a'; ctx.font='bold 28px monospace';
  ctx.fillText('KAIJU KID\'S QUEST', VW/2, 48);
  ctx.font='14px monospace'; ctx.fillStyle='#cfc6e6';
  ctx.fillText('Spirit Orbs: '+meta.orbs+'   Growth: '+(Progression.GROWTH_STAGES[meta.growthStage]||Progression.GROWTH_STAGES[0]).name, VW/2, 74);

  const nodes = Progression.LEVELS;
  const gap = VW/(nodes.length+1);
  const cy = VH/2;
  for(let i=0;i<nodes.length;i++){
    const n = nodes[i];
    const cx = gap*(i+1);
    const unlocked = Progression.isLevelUnlocked(meta, n.id);
    // connector
    if(i>0){ ctx.strokeStyle='#4a3a66'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(gap*i, cy); ctx.lineTo(cx, cy); ctx.stroke(); }
    // node circle — a window into the world's backdrop when unlocked
    const R = 27;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.clip();
    const bg = unlocked ? loadedSprites['bg_w'+n.world] : null;
    if(bg){ ctx.drawImage(bg, cx-R, cy-R, R*2, R*2); }
    else  { ctx.fillStyle = unlocked ? '#ff6db0' : '#3a2f50'; ctx.fillRect(cx-R, cy-R, R*2, R*2); }
    ctx.restore();
    // ring (highlighted node gets a thick white ring)
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
    ctx.strokeStyle = (i===owIdx) ? '#fff' : (unlocked ? '#ffd84a' : '#4a3a66');
    ctx.lineWidth   = (i===owIdx) ? 3 : 2; ctx.stroke();
    // number badge / lock
    ctx.textAlign='center';
    if(unlocked){
      ctx.fillStyle='rgba(10,6,20,0.6)'; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 16px monospace'; ctx.fillText(String(i+1), cx, cy+6);
    } else {
      ctx.fillStyle='#9a8fb5'; ctx.font='bold 20px monospace'; ctx.fillText('🔒', cx, cy+7);
    }
    // name
    ctx.fillStyle = unlocked ? '#fff' : '#7d7299';
    ctx.font='12px monospace';
    ctx.fillText(n.name, cx, cy+50);
    // stars
    const rec = meta.levels[n.id];
    if(rec){
      ctx.fillStyle='#ffd84a'; ctx.font='14px monospace';
      ctx.fillText('★'.repeat(rec.stars), cx, cy-40);
    }
  }
  ctx.fillStyle='#cfc6e6'; ctx.font='12px monospace';
  ctx.fillText('← → choose   ↑/Space enter', VW/2, VH-24);
  ctx.textAlign='left';
}

// ═══════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════
let lastT = 0, spritesReady = false;
function loop(ts){
  if(!spritesReady){
    ctx.fillStyle='#000911'; ctx.fillRect(0,0,VW,VH);
    ctx.textAlign='center'; ctx.fillStyle='#22ffaa'; ctx.font='bold 12px monospace';
    ctx.fillText('LOADING '+_spriteDone+'/'+_spriteCount+'...', VW/2, VH/2-8);
    ctx.fillStyle='#0a2a1a'; ctx.fillRect(VW/2-60,VH/2+4,120,8);
    ctx.fillStyle='#22ffaa';
    ctx.fillRect(VW/2-60,VH/2+4,Math.round(120*_spriteDone/Math.max(_spriteCount,1)),8);
    ctx.textAlign='left';
    requestAnimationFrame(loop);
    return;
  }
  const dt = Math.min(ts-lastT, 50);
  lastT = ts;
  update(dt);
  render();
  justDn.clear();
  requestAnimationFrame(loop);
}
Promise.all([loadSprites(), loadSkin(activeSkin), loadEnemies(), loadNpcs(), loadFood()]).then(()=>{ spritesReady=true; lastT=performance.now(); });
requestAnimationFrame(loop);
</script>
