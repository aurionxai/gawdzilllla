<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%A6%96</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;background:#000;overflow:hidden;
    touch-action:none;-webkit-tap-highlight-color:transparent;

<body>
<canvas id="c"></canvas>
<div id="lbov" style="display:none;position:fixed;inset:0;background:rgba(6,4,16,.72);z-index:50;align-items:center;justify-content:center;font-family:system-ui,sans-serif;">
  <div style="background:#1d1640;border:2px solid #6b4fb0;padding:22px 26px;border-radius:14px;text-align:center;max-width:300px;">
    <div id="lblabel" style="color:#fff;margin-bottom:12px;font-weight:700;font-size:15px;"></div>
    <input id="lbinput" autocomplete="off" style="font-size:20px;padding:9px 12px;border-radius:8px;border:2px solid #6b4fb0;text-align:center;width:170px;outline:none;">
    <div style="margin-top:14px;"><button id="lbok" style="font-size:15px;padding:8px 22px;border:0;border-radius:8px;background:#22cc77;color:#04210f;font-weight:700;cursor:pointer;">OK</button>
      <button id="lbcancel" style="font-size:15px;padding:8px 16px;border:0;border-radius:8px;background:#553f7a;color:#fff;cursor:pointer;margin-left:6px;">Cancel</button></div>
  </div>
</div>
<script src="progression.js"></script>
<script src="levelparse.js"></script>
<script>
// ═══════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════
const VW = 640, VH = 360;
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let _baseTransform = null;   // declared here: resize() assigns it before the line below runs
// Cache-busting: GitHub Pages serves assets with max-age=600, so an overwritten sound/sprite is
// replayed stale from the browser cache. Versioned URLs force a fresh fetch. BUMP on asset change.
const ASSET_VER = '7';   // bump ONLY when a sound/sprite/bg asset changes (busts those URLs)
const BUILD = '24';       // bump EVERY deploy — drives the stale-page auto-reload below; keep version.txt == BUILD
const _av = u => u + (u.indexOf('?')<0?'?':'&') + 'v=' + ASSET_VER;
// Auto-update: GitHub caches the HTML ~10 min, so players can run a stale build. Fetch the latest
// build tag (uncached); if this page is older, reload to a fresh cache-key URL — no manual hard-
// refresh needed. (One fresh load is still needed the FIRST time, to get this checker.)
fetch('version.txt?cb='+Date.now(), {cache:'no-store'}).then(r=>r.ok?r.text():null).then(v=>{
  v=v&&v.trim(); if(v && v!==BUILD && location.search.indexOf('b='+v)<0) location.replace(location.pathname+'?b='+v);
}).catch(()=>{});

function resize() {
  const vvp = window.visualViewport;
  const W = vvp ? vvp.width  : innerWidth;
  const H = vvp ? vvp.height : innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const sc  = Math.min(W / VW, H / VH);
  canvas.width  = Math.round(VW * sc * dpr);
  canvas.height = Math.round(VH * sc * dpr);
  canvas.style.width  = Math.round(VW * sc) + 'px';
  canvas.style.height = Math.round(VH * sc) + 'px';
  ctx.setTransform(sc * dpr, 0, 0, sc * dpr, 0, 0);
  _baseTransform = ctx.getTransform();   // base for the per-frame shake reset (see render)
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize, 120));
if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════
//  AUDIO  (Web Audio API — procedural)
// ═══════════════════════════════════════════
const AC = new (window.AudioContext||window.webkitAudioContext)();
// Master bus: a compressor (tames clipping + evens levels) into a gentle low-pass (cuts the
// harsh synth fizz). Every sound + the music route through here, so nothing sounds piercing.
const _master = AC.createDynamicsCompressor();
_master.threshold.value=-16; _master.knee.value=24; _master.ratio.value=3.2;
_master.attack.value=0.004; _master.release.value=0.22;
const _masterLP = AC.createBiquadFilter(); _masterLP.type='lowpass'; _masterLP.frequency.value=8500; _masterLP.Q.value=0.5;
const _masterGain = AC.createGain(); _masterGain.gain.value=1.4;   // makeup for the compression
_master.connect(_masterLP); _masterLP.connect(_masterGain); _masterGain.connect(AC.destination);

// ── Sub-mix buses + voice management (standard game-audio mixing) ──────────────
// SFX and music are SEPARATE buses into the master. Voice throttling stops identical sounds
// (e.g. 5 enemies dying to one fart) from stacking into a wall; a global cap limits total voices.
const _sfxBus   = AC.createGain(); _sfxBus.gain.value   = 0.85; _sfxBus.connect(_master);
// Music connects AFTER the compressor (at _masterGain), NOT through it — otherwise every loud SFX
// makes the shared compressor clamp the whole mix and the music audibly pumps/"interrupts".
const _musicBus = AC.createGain(); _musicBus.gain.value = 0.7;  _musicBus.connect(_masterGain);
const _sfxLast  = {};         // name -> last start time, to throttle re-triggers
let   _sfxVoices = 0;         // currently-ringing SFX voices

// ═══════════════════════════════════════════
//  SPRITES
// ═══════════════════════════════════════════
const SPRITES = {
  // Hero frames come from the active SKIN; enemies from the ENEMIES registry;
  // citizens (townsfolk) from NPC_TYPES. None are hardcoded here.
  // World backdrops (local, per Progression world): drawBg picks bg_w<N> by level id.
  bg_w1:         'bg/world1.jpg',   // Tokyo Day
  bg_w2:         'bg/world2.jpg',   // Neon Shibuya
  bg_w3:         'bg/world3.jpg',   // Sunken City (underwater)
  bg_w4:         'bg/world4.jpg',   // Volcano Skyline
};
const loadedSprites = {};
let _spriteCount = 0, _spriteDone = 0;
function loadSprites() {
  const entries = Object.entries(SPRITES);
  _spriteCount = entries.length;
  return Promise.all(entries.map(([key, url]) => new Promise(res => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => { loadedSprites[key] = img; _spriteDone++; res(); };
    img.onerror = () => { _spriteDone++; res(); };
    img.src = _av(url);
  })));
}

// ═══════════════════════════════════════════
//  CHARACTER SKINS  (swappable; future store / contributor packs)
// ═══════════════════════════════════════════
// A skin maps the animation keys the game requests (from _kaijuKey) to image
// files in the skin's asset pack. Adding a skin = drop a folder under skins/
// and add an entry here; no render-code changes. activeSkin selects which one.
const SKINS = {
  default: {
    name: 'Sakura',
    frames: {
      lulah_idle:   'skins/default/lulah_idle.png',
      lulah_walk_1: 'skins/default/lulah_walk1.png',
      lulah_walk_2: 'skins/default/lulah_walk2.png',
      lulah_walk_3: 'skins/default/lulah_walk1.png',
      lulah_walk_4: 'skins/default/lulah_walk2.png',
      lulah_jump:   'skins/default/lulah_jump.png',
      lulah_eat_1:  'skins/default/lulah_eat.png',
      lulah_eat_2:  'skins/default/lulah_idle.png',
      lulah_fart_1: 'skins/default/lulah_fart.png',
      lulah_fart_2: 'skins/default/lulah_fart.png',
      poppy_idle:   'skins/default/poppy_idle.png',
      poppy_walk_1: 'skins/default/poppy_walk_1.png',
      poppy_walk_2: 'skins/default/poppy_walk_2.png',
      poppy_walk_3: 'skins/default/poppy_walk_3.png',
      poppy_walk_4: 'skins/default/poppy_walk_4.png',
      poppy_jump:   'skins/default/poppy_jump.png',
      poppy_eat_1:  'skins/default/poppy_eat_1.png',
      poppy_eat_2:  'skins/default/poppy_eat_2.png',
      poppy_fart_1: 'skins/default/poppy_fart_1.png',
      poppy_fart_2: 'skins/default/poppy_fart_2.png',
    },
  },
};
let activeSkin = 'default';
// Load a skin's frames into loadedSprites under the animation keys the game uses.
function loadSkin(id){
  const skin = SKINS[id] || SKINS.default;
  const entries = Object.entries(skin.frames);
  return Promise.all(entries.map(([key, url]) => new Promise(res => {
    const img = new Image();
    img.onload  = () => { loadedSprites[key] = img; res(); };
    img.onerror = () => { res(); };
    img.src = _av(url);
  })));
}

// ═══════════════════════════════════════════
//  ENEMIES  (data-driven roster; sprites grow with the hero's growth stage)
// ═══════════════════════════════════════════
// w/h = base visual draw size (px) at growth scale 1; big = heavy class (slower,
// worth more, bigger hp-bar); hp = spawn hit points; world = which world it belongs to.
// Each enemy also carries a Japanese word (real animal/monster words) spoken in the male voice on
// defeat — kids learn 'snake / crab / ghost / dragon…' by beating baddies. jp clip: jp/<type>_m.mp3
const ENEMIES = {
  slime:    { file:'enemies/slime.png',     w:46, h:40, big:false, hp:40,  world:1, jp:'スライム', ro:'Suraimu', en:'slime' },
  whelp:    { file:'enemies/whelp.png',     w:37, h:44, big:true,  hp:80,  world:1, jp:'ドラゴン', ro:'Doragon', en:'dragon' },
  tinbot:   { file:'enemies/tinbot.png',    w:31, h:44, big:false, hp:50,  world:1, jp:'ロボット', ro:'Robotto', en:'robot' },
  neonbot:  { file:'enemies/neonbot.png',   w:53, h:32, big:false, hp:50,  world:2, jp:'ロボット', ro:'Robotto', en:'robot' },
  ghoul:    { file:'enemies/ghoul.png',     w:33, h:44, big:false, hp:50,  world:2, jp:'おばけ',   ro:'Obake',   en:'monster' },
  jellymech:{ file:'enemies/jellymech.png', w:38, h:44, big:true,  hp:90,  world:3, jp:'クラゲ',   ro:'Kurage',  en:'jellyfish' },
  lavaimp:  { file:'enemies/lavaimp.png',   w:28, h:44, big:false, hp:60,  world:4, jp:'おに',     ro:'Oni',     en:'ogre' },
  golem:    { file:'enemies/golem.png',     w:47, h:42, big:true,  hp:120, world:4, jp:'ゴーレム', ro:'Gōremu',  en:'golem' },
  // World 4 volcano set — generated on Higgsfield + sliced by the asset-slicer agent.
  magma_slug:    { file:'enemies/magma_slug.png',    w:40, h:36, big:false, hp:45,  world:4, jp:'なめくじ', ro:'Namekuji', en:'slug' },
  ember_bat:     { file:'enemies/ember_bat.png',     w:46, h:34, big:false, hp:40,  world:4, jp:'こうもり', ro:'Kōmori',   en:'bat' },
  obsidian_crab: { file:'enemies/obsidian_crab.png', w:48, h:40, big:true,  hp:100, world:4, jp:'かに',     ro:'Kani',     en:'crab' },
  flame_wisp:    { file:'enemies/flame_wisp.png',    w:30, h:42, big:false, hp:35,  world:4, jp:'おにび',   ro:'Onibi',    en:'fire spirit' },
  // World 2 Neon Shibuya set — asset-pipeline (Higgsfield + asset-slicer agent).
  glitch_drone:  { file:'enemies/glitch_drone.png',  w:44, h:32, big:false, hp:45,  world:2, jp:'ドローン', ro:'Dorōn',  en:'drone' },
  karaoke_bot:   { file:'enemies/karaoke_bot.png',   w:36, h:44, big:false, hp:55,  world:2, jp:'うた',     ro:'Uta',    en:'song' },
  pixel_ghost:   { file:'enemies/pixel_ghost.png',   w:34, h:40, big:false, hp:40,  world:2, jp:'ゆうれい', ro:'Yūrei',  en:'ghost' },
  neon_serpent:  { file:'enemies/neon_serpent.png',  w:46, h:36, big:false, hp:50,  world:2, jp:'へび',     ro:'Hebi',   en:'snake' },
  // World 3 Sunken City set — asset-pipeline (Higgsfield + asset-slicer agent).
  mecha_pufferfish:{ file:'enemies/mecha_pufferfish.png', w:42, h:40, big:false, hp:60, world:3, jp:'ふぐ',   ro:'Fugu',   en:'pufferfish' },
  anchor_bot:    { file:'enemies/anchor_bot.png',    w:36, h:44, big:true,  hp:90,  world:3, jp:'いかり',   ro:'Ikari',  en:'anchor' },
  bubble_eel:    { file:'enemies/bubble_eel.png',    w:46, h:34, big:false, hp:45,  world:3, jp:'うなぎ',   ro:'Unagi',  en:'eel' },
  coral_crab:    { file:'enemies/coral_crab.png',    w:46, h:40, big:true,  hp:90,  world:3, jp:'かに',     ro:'Kani',   en:'crab' },
};
function enemyBig(e){ const d=ENEMIES[e.type]; return !!(d && d.big); }
function loadEnemies(){
  return Promise.all(Object.entries(ENEMIES).map(([k,def]) => new Promise(res => {
    const img = new Image();
    img.onload  = () => { loadedSprites['en_'+k] = img; res(); };
    img.onerror = () => { res(); };
    img.src = _av(def.file);
  })));
}

// The 8 named townsfolk the player rescues (the "citizens"). Loaded as npc_<name>.
const NPC_TYPES = ['chef','obachan','otaku','idol','tourist','sumo','salaryman','schoolgirl'];
// Gender per townsperson, so the spoken Japanese uses a matching male/female voice.
const NPC_GENDER = { chef:'m', obachan:'f', otaku:'m', idol:'f', tourist:'f', sumo:'m', salaryman:'m', schoolgirl:'f' };
function loadNpcs(){
  return Promise.all(NPC_TYPES.map(n => new Promise(res => {
    const img = new Image();
    img.onload  = () => { loadedSprites['npc_'+n] = img; res(); };
    img.onerror = () => { res(); };
    img.src = _av('npcs/'+n+'.png');
  })));
}

// Boss frames (Higgsfield pixel art — see bosses/HIGGSFIELD-RIOT-MECHA.md). Optional: until the
// PNGs exist, onerror just leaves them unloaded and drawBoss falls back to the procedural placeholder.
const BOSS_FRAMES = { riot_idle:'bosses/riot_idle.png', riot_windup:'bosses/riot_windup.png', riot_slam:'bosses/riot_slam.png', riot_defeat:'bosses/riot_defeat.png',
                      giant_idle:'bosses/giant_idle.png', giant_windup:'bosses/giant_windup.png', giant_slam:'bosses/giant_slam.png', giant_defeat:'bosses/giant_defeat.png' };
function loadBoss(){
  return Promise.all(Object.entries(BOSS_FRAMES).map(([key,url]) => new Promise(res => {
    const img = new Image();
    img.onload  = () => { loadedSprites[key] = img; res(); };
    img.onerror = () => { res(); };
    img.src = _av(url);
  })));
}

// Carrier crane frames (Higgsfield nano_banana_pro pixel art, bg-removed) — the secret-door cinematic.
const CRANE_FRAMES = { crane_up:'skins/crane/crane_up.png', crane_mid:'skins/crane/crane_mid.png', crane_down:'skins/crane/crane_down.png' };
function loadCrane(){
  return Promise.all(Object.entries(CRANE_FRAMES).map(([key,url]) => new Promise(res => {
    const img = new Image();
    img.onload  = () => { loadedSprites[key] = img; res(); };
    img.onerror = () => { res(); };
    img.src = _av(url);
  })));
}

function acResume(){ if(AC.state!=='running'){ try{ AC.resume(); }catch(e){} } }   // 'suspended' AND iOS 'interrupted'

// ── Sound-sample swap layer ──────────────────────────────────────────────────
// Each sound prefers a real sample at sounds/<name>.{mp3,wav}; if none is present it
// falls back to the procedural synth (the `if(playSample('x'))return;` guards below).
// Drop Higgsfield-generated SFX into kaiju-clash/sounds/ and they auto-override the synth.
const SFX_NAMES = ['jump','chomp','fart','fart1','fart2','fart3','giggle','hurt','fall','victory','gameover','cheer',
  'combo','roar','gem','eat_yakitori','eat_pizza','eat_sushi','eat_hotdog','eat_icecream',
  'eat_banana','enemy_squish','enemy_clank','enemy_screech','enemy_sizzle','enemy_thud',
  'enemy_squish_die','enemy_clank_die','enemy_thud_die','music','boss_music'];
const loadedSfx = {};
function loadSfx(){
  return Promise.all(SFX_NAMES.flatMap(n => ['mp3','wav'].map(ext =>
    fetch(_av('sounds/'+n+'.'+ext)).then(r => r.ok ? r.arrayBuffer() : Promise.reject())
      .then(b => new Promise((res,rej)=>AC.decodeAudioData(b,res,rej)))
      .then(buf => { if(!loadedSfx[n]) loadedSfx[n]=buf; }).catch(()=>{})
  )));
}
// Spoken Japanese vocab clips, male + female (sounds/jp/<key>_<g>.mp3) -> loadedSfx['jp_<key>_<g>']
function loadJpVoices(){
  const vocab = Object.values(WORLD_VOCAB).flat().map(v=>v.key);
  const files = [
    ...vocab.flatMap(k => ['f','m'].map(g => k+'_'+g)),   // rescue words: both voices
    ...FOOD_TYPES.map(f => f.key+'_f'),                    // food words: female (the girl hero)
    ...Object.keys(ENEMIES).map(k => k+'_m'),             // enemy words: male (monster voice)
  ];
  return Promise.all(files.map(nm =>
    fetch(_av('sounds/jp/'+nm+'.mp3')).then(r => r.ok ? r.arrayBuffer() : Promise.reject())
      .then(b => new Promise((res,rej)=>AC.decodeAudioData(b,res,rej)))
      .then(buf => { loadedSfx['jp_'+nm]=buf; }).catch(()=>{})
  ));
}
function playSample(name, vol, when, force){
  const buf = loadedSfx[name]; if(!buf) return false;
  acResume();
  const now = AC.currentTime;
  // Throttle re-triggers of the SAME sound, timed on the wall clock (performance.now, ms) so it
  // works even before the audio clock starts. Window scales with clip length, so short sounds can
  // repeat quickly but a long one (e.g. the 2.2s giggle) won't stack on itself. `force` bypasses it
  // for intentional replays (the word book).
  const tnow = performance.now();
  const minGap = Math.max(55, Math.min(buf.duration*500, 1200));   // ms
  if(!force && tnow - (_sfxLast[name]||0) < minGap) return true;   // return true so callers still skip the synth fallback
  // Global voice cap — if a lot is already ringing, drop this one rather than pile on.
  if(!force && _sfxVoices >= 8) return true;
  _sfxLast[name] = tnow;
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf; g.gain.value=(vol==null?0.8:vol); s.connect(g); g.connect(_sfxBus);
  _sfxVoices++; s.onended = ()=>{ _sfxVoices = Math.max(0, _sfxVoices-1); };
  s.start(now + (when||0));   // `when` lets a sample ring out after another (e.g. giggle after the fart)
  return true;
}
// iOS/desktop Safari won't make a sound until a buffer is played inside a user gesture —
// resume() alone isn't enough. Play one silent buffer on the first interaction to unlock.
let _audioUnlocked = false, _silentEl;
function unlockAudio(){
  acResume();                       // safe every time — resumes the context if it got suspended/interrupted
  if(_audioUnlocked) return;        // everything below runs ONCE, not on every keydown/click
  try{
    const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
    s.buffer=b; s.connect(_master); s.start(0);
  }catch(e){}
  // iOS Safari silences ALL Web Audio when the ring/silent switch is on — UNLESS a media element is
  // playing. A silent looping <audio> keeps the audio session active so the game is audible even on a
  // muted iPhone. (Playwright/desktop don't surface this; real iPhones do.)
  try{ _silentEl=new Audio(_av('sounds/silent.mp3')); _silentEl.loop=true; _silentEl.setAttribute('playsinline',''); _silentEl.volume=0.01; _silentEl.play().catch(()=>{}); }catch(e){}
  _audioUnlocked=true;
  // Safari freezes AC.currentTime while suspended, so music scheduled before the unlock is lost —
  // force ONE clean restart now that the context is actually running. (Previously this ran on every
  // keystroke, restarting the track from the top each time — the "music re-loops on keypress" bug.)
  if(typeof stopMusic==='function') stopMusic();
}
['pointerdown','touchstart','mousedown','keydown','click'].forEach(ev =>
  window.addEventListener(ev, unlockAudio, {passive:true}));
// iOS suspends audio when the tab backgrounds — resume when it returns.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) acResume(); });

function sndChomp(){
  acResume();
  if(playSample("chomp"))return;
  const buf = AC.createBuffer(1, AC.sampleRate*0.14, AC.sampleRate);
  const d   = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5)*0.5;
  const src  = AC.createBufferSource();
  const gain = AC.createGain();
  src.buffer=buf; gain.gain.value=0.45;
  src.connect(gain); gain.connect(_master); src.start();
}

let _noiseBuf = null;
function _noiseBuffer(){
  if(!_noiseBuf){
    const n = Math.floor(AC.sampleRate * 2.5);
    _noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
    const d = _noiseBuf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
  }
  return _noiseBuf;
}
function sndFart(size){ // 1=tiny 2=medium 3=mega — sputtery noise + brass-y pitch drop
  acResume();
  if(playSample("fart"+size, [0,0.72,0.86,1.0][size]||0.8))return;  // per-size real fart (louder as it grows)
  if(playSample("fart"))return;                                     // generic fallback if a size clip is missing
  const t0  = AC.currentTime;
  const dur = [0,0.45,0.95,2.0][size];
  // tonal "brass" body that glides down in pitch
  const osc = AC.createOscillator(); osc.type='sawtooth';
  osc.frequency.setValueAtTime([0,200,260,320][size], t0);
  osc.frequency.exponentialRampToValueAtTime([0,55,46,36][size], t0+dur);
  const oscG = AC.createGain(); oscG.gain.value = 0.5;
  // square LFO chopping the amplitude -> the "pbpbpbpb" sputter
  const lfo  = AC.createOscillator(); lfo.type='square'; lfo.frequency.value = [0,17,11,7][size];
  const lfoG = AC.createGain(); lfoG.gain.value = 0.5;

//  THEME MUSIC — a looping chiptune (square lead + triangle bass)
// ═══════════════════════════════════════════
const _musicGain = AC.createGain(); _musicGain.gain.value = 0.16; _musicGain.connect(_master);
let musicOn = true;
const _NF = { '.':0, A2:110, F2:87.31, C3:130.81, G2:98, A3:220, C4:261.63, D4:293.66,
              E4:329.63, F4:349.23, G4:392, A4:440, C5:523.25, D5:587.33, E5:659.25, G5:783.99 };
const _BPM = 158, _STEP = 60/_BPM/4;          // 16th-note grid — driving tempo
const _ROOTS = ['A2','F2','C3','G2'];          // 4-bar loop: Am F C G
const _KICK  = '1001001010010010';             // four-on-floor-ish with a push
const _SNARE = '0000100000001000';
const _HAT   = '1011101110111011';
// bouncy A-minor-pentatonic lead, one note per cell ('.'=rest), 16 cells per bar
const _LEADBARS = [
  ['A4','.','C5','.','E5','.','D5','.','C5','.','A4','.','E5','.','D5','.'],
  ['C5','.','A4','.','C5','.','E5','.','D5','.','C5','.','A4','.','G4','.'],
  ['E5','.','D5','.','C5','.','A4','.','G4','.','A4','.','C5','.','D5','.'],
  ['E5','.','G5','.','E5','.','D5','.','C5','.','A4','.','G4','.','E4','.'],
];
let _music = { on:false, t:0, bar:0, timer:null };
function _noteAt(note, t, dur, type, vol){
  const f=_NF[note]; if(!f) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  const end=t+dur*0.9;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,end);
  o.connect(g); g.connect(_musicGain); o.start(t); o.stop(end+0.02);
}
function _drum(kind, t){
  if(kind==='K'){ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine';
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
    g.gain.setValueAtTime(0.95,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g); g.connect(_musicGain); o.start(t); o.stop(t+0.16); }
  else { const s=AC.createBufferSource(); s.buffer=_noiseBuffer();
    const hp=AC.createBiquadFilter(); hp.type='highpass';
    hp.frequency.setValueAtTime(kind==='S'?1200:7000, t);
    const g=AC.createGain(); const v=kind==='S'?0.5:0.2, d=kind==='S'?0.13:0.04;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    s.connect(hp); hp.connect(g); g.connect(_musicGain); s.start(t); s.stop(t+d+0.01); }
}
function _scheduleBar(t0){
  const bar=_music.bar%4, root=_ROOTS[bar], lead=_LEADBARS[bar];
  for(let st=0; st<16; st++){
    const t=t0+st*_STEP;
    if(_KICK[st]==='1')  _drum('K',t);
    if(_SNARE[st]==='1') _drum('S',t);
    if(_HAT[st]==='1')   _drum('H',t);
    if(st%2===0)         _noteAt(root, t, _STEP*1.7, 'triangle', 0.55);   // pumping 8th bass
    if(lead[st]!=='.')   _noteAt(lead[st], t, _STEP*1.5, 'square', 0.4);  // bouncy lead
  }
}
function _musicTick(){
  if(!_music.on) return;
  try {
    while(_music.t < AC.currentTime + 0.5){ _scheduleBar(_music.t); _music.t += 16*_STEP; _music.bar++; }
  } catch(e){}
  _music.timer = setTimeout(_musicTick, 110);
}
let _musicSrc=null, _musicTrack=null;
// Boss levels get their own theme (sounds/boss_music.mp3); everything else uses the main theme.
function _desiredTrack(){
  if(state && state.level && state.level.boss && loadedSfx['boss_music']) return 'boss_music';
  return 'music';
}
function startMusic(){
  if(!musicOn) return;
  const want = _desiredTrack();
  if(_music.on && _musicTrack===want) return;   // already playing the right track
  if(_music.on) stopMusic();                     // switching tracks (e.g. into the boss arena)
  acResume();
  _music.on=true; _musicTrack=want;
  if(loadedSfx[want]){                            // a real looping track overrides the synth
    try{ _musicSrc=AC.createBufferSource(); _musicSrc.buffer=loadedSfx[want]; _musicSrc.loop=true;
         const mg=AC.createGain(); mg.gain.value = want==='boss_music' ? 0.58 : 0.55;  // music normalized to -20 LUFS (sits under the -16 SFX); this is the in-game balance knob
         _musicSrc.connect(mg); mg.connect(_musicBus); _musicSrc.start(); }catch(e){}
    return;
  }
  _music.t=AC.currentTime+0.1; _music.bar=0;     // synth fallback (main theme only)
  _musicTick();
}
function stopMusic(){ _music.on=false; _musicTrack=null; if(_music.timer) clearTimeout(_music.timer); _music.timer=null;
  if(_musicSrc){ try{_musicSrc.stop();}catch(e){} _musicSrc=null; } }
function toggleMusic(){ musicOn=!musicOn; if(musicOn){ if(scene==='playing') startMusic(); } else stopMusic(); }

const keys   = new Set();
const justDn = new Set();

window.addEventListener('keydown', e=>{
  if(AC.state==='suspended') AC.resume();
  const prev = keys.has(e.code);
  keys.add(e.code);
  if(!prev){ justDn.add(e.code); if(CONTROLS.music.includes(e.code)) toggleMusic(); }
  if(_PD.has(e.code)) e.preventDefault();
});

// ── CONTROLS — SINGLE SOURCE OF TRUTH (rule: see CLAUDE.md "Controls") ──────────────────────
// Keys are CONTEXT-SCOPED: the same key may mean different things in gameplay vs menus (e.g. Z =
// fart in play, "confirm" in menus) — that's allowed. THE RULE: a key must NOT map to two actions
// within ONE context. _ctlCheck() warns at startup if it does. Add/rename keys ONLY here.
const CONTROLS = {
  left:'ArrowLeft KeyA', right:'ArrowRight KeyD', jump:'ArrowUp KeyW Space', duck:'ArrowDown KeyS',
  fart:'KeyZ KeyJ KeyX', book:'KeyB', music:'KeyM',
  confirm:'Space Enter ArrowUp KeyW KeyZ', back:'Escape Backspace',
};
Object.keys(CONTROLS).forEach(k=>CONTROLS[k]=CONTROLS[k].split(' '));
const _CTL_CTX = { gameplay:['left','right','jump','duck','fart','book','music'], menu:['left','right','confirm','back','book','music'] };
(function _ctlCheck(){ for(const [ctx,acts] of Object.entries(_CTL_CTX)){ const seen={};
  for(const a of acts) for(const k of CONTROLS[a]){ if(seen[k]) console.warn('⚠ CONTROL CONFLICT ['+ctx+']: '+k+' = '+seen[k]+' AND '+a); seen[k]=a; } } })();
const _held = a => CONTROLS[a].some(k=>keys.has(k));     // action held this frame
const _hit  = a => CONTROLS[a].some(k=>justDn.has(k));   // action just pressed this frame
const _PD = new Set([].concat(CONTROLS.left,CONTROLS.right,CONTROLS.jump,CONTROLS.duck,CONTROLS.fart,CONTROLS.book));  // suppress browser default (scroll/nav) for these
function isDuck(){ return _held('duck'); }
function pressedBook(){ return _hit('book'); }
function menuConfirm(){ return _hit('confirm'); }  // start / select / continue
function menuBack(){    return _hit('back'); }
function menuLeft(){    return _hit('left'); }
function menuRight(){   return _hit('right'); }

// Mobile touch buttons (drawn on canvas, tracked via touch)
const BTNS = {};  // populated in drawTouchControls
let touches = {}, _lastTouchCount = 0;
window.addEventListener('touchstart', e=>{ acResume(); [...e.changedTouches].forEach(t=>{ touches[t.identifier]={x:t.clientX,y:t.clientY}; }); e.preventDefault(); },{passive:false});
window.addEventListener('touchmove',  e=>{ [...e.changedTouches].forEach(t=>{ touches[t.identifier]={x:t.clientX,y:t.clientY}; }); e.preventDefault(); },{passive:false});
window.addEventListener('touchend',   e=>{ [...e.changedTouches].forEach(t=>{ delete touches[t.identifier]; }); e.preventDefault(); },{passive:false});

function touchInBtn(name){
  const b = BTNS[name]; if(!b) return false;
  const rect = canvas.getBoundingClientRect();
  const scX = VW / rect.width, scY = VH / rect.height;
  return Object.values(touches).some(t=>{
    const cx = (t.x - rect.left) * scX;
    const cy = (t.y - rect.top)  * scY;
    return cx>=b.x && cx<=b.x+b.w && cy>=b.y && cy<=b.y+b.h;
  });
}
function isMoveL(){ return _held('left')  || touchInBtn('left'); }
function isMoveR(){ return _held('right') || touchInBtn('right'); }
function isJump(){  return _held('jump')  || touchInBtn('jump'); }
function isFart(){  return _hit('fart')   || touchInBtn('fart'); }   // B is the Word Book, not fart

// T=0 air, T=1 solid, T=2 one-way platform, T=3 destructible
const T_AIR=0, T_SOLID=1, T_PLAT=2, T_DEST=3, T_HAZARD=4, T_SHOCK=5;
// World-2 shock floor pulses on a shared clock: ~1.1s LIVE (zaps), brief WARN flicker, then ~1s SAFE.
function _shockState(){ const t=Date.now()%2200; return t<1100 ? 'on' : (t>1850 ? 'warn' : 'off'); }

// Convert an ASCII tilemap (array of strings) into a game level object.
function buildFromRows(rows){
  const p = LevelParse.parseLevel(rows);
  LW = p.LW; LH = p.LH;                       // level dims are global, set on build
  // Spawn chars only give a column; the entity must rest on the first solid/platform
  // surface at or below that row (otherwise NPCs/enemies float in mid-air on a tall map).
  const surfaceTop = (col, fromRow)=>{
    for(let r=fromRow; r<p.LH; r++){
      const v = p.tiles[r] && p.tiles[r][col];
      if(v===T_SOLID || v===T_DEST || v===T_PLAT || v===T_SHOCK) return r*TS;
    }
    return p.LH*TS;                           // virtual floor below the map
  };
  const food = p.spawns.food.map((s,i)=>({
    type: FOOD_TYPES[i % FOOD_TYPES.length],
    x: s.c*TS + TS/2 - 10, y: surfaceTop(s.c, s.r) - 30, collected:false, bobOff:i*0.8,
  }));
  const enemies = p.spawns.enemies.map(s=>({
    x: s.c*TS, y: surfaceTop(s.c, s.r) - ENEMY_FOOT, dir:-1, type:s.type,
    hp: ENEMIES[s.type].hp, maxHp: ENEMIES[s.type].hp,
    patrol:[(s.c-3)*TS, (s.c+3)*TS], stunMs:0, dead:false, flashMs:0,
  }));
  const citizens = p.spawns.citizens.map((s,i)=>({
    x: s.c*TS, y: surfaceTop(s.c, s.r) - 22, dir: i%2?1:-1, clr:'#ffd8a8', npc: NPC_TYPES[i % NPC_TYPES.length],
    saved:false, eaten:false, eatenTimer:0, savedTimer:0, particles:[],
  }));
  const gems = (p.spawns.gems||[]).map((s,i)=>({   // word-gems: visible so the exit gate is fair to find
    x: s.c*TS + TS/2, y: s.r*TS + TS/2, hidden:false, collected:false, revealMs:0, bob:i*0.7,
  }));
  const ps = p.spawns.player || { r:7, c:2 };
  // Rest the player's 66px box ON the surface below its spawn char, not embedded in
  // the floor — otherwise resolveX reads the buried floor tile as a wall and marches
  // the player a tile/frame to the exit (the level "plays itself").
  const door = p.spawns.door ? { r:p.spawns.door.r, c:p.spawns.door.c, hidden:true, used:false } : null;  // hidden until fart-revealed
  return { tiles:p.tiles, food, enemies, citizens, gems,
           playerSpawn:{ x:ps.c*TS, y: surfaceTop(ps.c, ps.r) - 66 }, exit:p.spawns.exit, door, LW:p.LW, LH:p.LH };
}

  const _lvl = (typeof Progression!=='undefined') && Progression.LEVELS.find(l=>l.id===levelId);
  const diff = _lvl ? ((_lvl.world-1)*4 + _lvl.order) : 1;   // w1l1=1, w1l2=2, w1l3=3, ...

  const s = state;
  const total = s.level.citizens.length;
  const timeSec = Math.max(0, Math.round((tick - s.startTick)/60));
  const gemTotal = (s.level.gems||[]).length, par = LEVEL_PAR[s.levelId] || 60;
  // Objective checklist shown on the results card (words are gate-required, so they read as done).
  const objectives = [
    { icon:'🏁', label:'Reach the flag', done:true },
    { icon:'💎', label:'All words '+s.gemsCollected+'/'+gemTotal, done: gemTotal===0 || s.gemsCollected>=gemTotal, hide: gemTotal===0 },
    { icon:'🤝', label:'Rescue everyone '+s.savedCitizens+'/'+total, done: total===0 || s.savedCitizens>=total, hide: total===0 },
    { icon:'⏱️', label:'Beat the clock (<'+par+'s)', done: timeSec<=par },
    { icon:'💪', label:'Take no damage', done: s.hitsTaken===0 },
  ].filter(o=>!o.hide);
  const earnedStars = (total===0||s.savedCitizens>=total?1:0) + (timeSec<=par?1:0) + (s.hitsTaken===0?1:0);   // 0-3 skill stars
  const rank = Progression.computeRank({
    timeSec, hitsTaken: s.hitsTaken, citizensSaved: s.savedCitizens, citizensTotal: total,
  });
  const before = meta.orbs;
  meta = Progression.applyResult(meta, {
    levelId: s.levelId, rank, citizensSaved: s.savedCitizens, citizensTotal: total, sideQuestsDone: 0,
  });
  saveMeta();
  lastResult = { rank, orbsEarned: meta.orbs - before, stars: earnedStars, timeSec, saved: s.savedCitizens, total, objectives };
  scene='victory'; sndVictory();
  _lbSubmit(s.levelId, Math.round((tick - s.startTick)/60*1000)); _lbSyncWords();   // leaderboard: best time + words
}

// ═══════════════════════════════════════════
//  TILE HELPERS
// ═══════════════════════════════════════════
function tile(t,r,c){
  // No virtual floor below the map: holes are bottomless so falling in is lethal.
  if(r<0||r>=LH||c<0||c>=LW) return T_AIR;
  return t[r][c];
}
function solid(t,r,c){ const v=tile(t,r,c); return v===T_SOLID||v===T_DEST||v===T_SHOCK; }   // shock floor is standable (but zaps when live)
function plat(t,r,c){  return tile(t,r,c)===T_PLAT; }

// ═══════════════════════════════════════════
//  PHYSICS / PLAYER UPDATE
// ═══════════════════════════════════════════
function updatePlayer(dt, s){
  const pl = s.player;
  const tiles = s.level.tiles;
  const PW=44, PH=66;  // player bounding box

  pl.invincMs    = Math.max(0, pl.invincMs  - dt);
  pl.eatAnim     = Math.max(0, pl.eatAnim   - dt);
  pl.fartAnim    = Math.max(0, pl.fartAnim  - dt);
  pl.biteCooldown= Math.max(0, (pl.biteCooldown||0) - dt);

  // ── Input
  const spd = s.charKey==='poppy' ? 3.4 : 2.9;   // snappier base pace
  if(isMoveL()){ pl.vx=-spd; pl.dir=-1; }
  else if(isMoveR()){ pl.vx=spd; pl.dir=1; }
  else { pl.vx *= 0.60; if(Math.abs(pl.vx)<0.35) pl.vx=0; }

  // ── Jump
  const jumpNow = isJump();
  if(jumpNow && !pl.jumpPressed && pl.onGround){
    pl.vy = s.charKey==='poppy' ? -10.5 : -9.8;   // lulah: 9.8 clears a 3-tile (96px) gap with ~30px margin
    pl.onGround = false;
    sndJump();
  }
  pl.jumpPressed = jumpNow;

  // ── Drop through platform
  if(isDuck() && pl.onGround){ pl.y+=4; pl.onGround=false; }

  // ── Attack (Z/X): bite when no meter, fart when charged
  if(isFart()){
    if(pl.fartMeter >= 20) doFart(s);
    else doBite(s);
  }

  // ── Gravity
  if(!pl.onGround){ pl.vy = Math.min(pl.vy+GRAV, MAXVY); }

  // ── Move X
  pl.x += pl.vx;
  resolveX(pl, tiles, PW, PH);

  // ── Move Y
  pl.y += pl.vy;
  pl.onGround = false;
  resolveY(pl, tiles, PW, PH);
  if(pl.onGround) pl.stompCombo = 0;   // chain ends when you touch the ground

  // ── Spikes / hazards: damage if the player's box overlaps a hazard tile ──
  if((pl.invincMs||0) <= 0){
    const c0 = Math.floor(pl.x / TS), c1 = Math.floor((pl.x+PW) / TS);
    const r0 = Math.floor(pl.y / TS), r1 = Math.floor((pl.y+PH) / TS);
    let onHazard = false, onShock = false;
    for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){ const tt=tile(tiles,r,c); if(tt===T_HAZARD) onHazard=true; else if(tt===T_SHOCK) onShock=true; }
    if(onShock && _shockState()==='on'){          // live shock floor — zap
      pl.hp = Math.max(0, pl.hp - 10); pl.invincMs = 900; s.hitsTaken++; pl.vy = -7;
      addShake(6, 200); sndHurt(); pushNum(s, pl.x, pl.y-20, '-10', '#5ad6ff');
      pushMsg(s, '⚡ ZAP!', 600, '#5ad6ff', 'md');
    } else if(onHazard){
      pl.hp = Math.max(0, pl.hp - 12);
      pl.invincMs = 1000;
      s.hitsTaken++;
      pl.vy = -6;                     // small knock-up
      addShake(5, 180);
      sndHurt();                      // feedback so spike damage isn't silent
      pushNum(s, pl.x, pl.y-20, '-12', '#ff3333');
      pushMsg(s, '🌵 OUCH!', 600, '#ff5555', 'md');
    }
  }

  // ── Bounds
  pl.x = Math.max(0, Math.min(LW*TS - PW, pl.x));
  // Fall in a hole / off the edge -> you're done. Scream the moment you pass the floor
  // line, then die a beat later so it reads as a fall, not a teleport.
  if(pl.y > LH*TS && !pl.falling){ pl.falling = true; sndFall(); pushMsg(s, '😱 AAAH!', 700, '#ff5555', 'lg'); }
  if(pl.y > LH*TS + 70){ pl.hp = 0; }

  // ── Camera
  const tx = pl.x + PW/2 - VW/2;
  s.cam.x += (tx - s.cam.x) * 0.11;
  s.cam.x = Math.max(0, Math.min(LW*TS - VW, s.cam.x));
  // Vertical follow: keep the player ~55% down the screen; clamp to level height.
  const tyc = pl.y - VH*0.55;
  s.cam.y += (tyc - s.cam.y) * 0.11;
  s.cam.y = Math.max(0, Math.min(Math.max(0, LH*TS - VH), s.cam.y));

  // ── Stomp enemies from above
  if(pl.vy > 0 && state){
    const PW=44, PH=66;
    state.level.enemies.forEach(e=>{
      if(e.dead) return;                                   // stunned enemies CAN be re-bopped (Mario chain)
      const ew=eW(e), eh=eH(e);
      const prevFeet = pl.y+PH - pl.vy;
      const eFeetTop = e.y;
      if(pl.x+PW-6 > e.x && pl.x+6 < e.x+ew &&
         prevFeet <= eFeetTop+4 && pl.y+PH >= eFeetTop){
        e.stunMs = Math.max(e.stunMs, 900);
        e.flashMs = 140;                 // brief sprite-shaped hit flash (not a box)
        e.hp -= 25;
        // Combo: each stomp before landing chains for escalating points (100,200,400,...).
        pl.stompCombo = (pl.stompCombo||0) + 1;
        const mult = pl.stompCombo;
        const base = e.hp<=0 ? (enemyBig(e)?300:100) : 25;
        if(e.hp<=0){ e.dead=true; addShake(5,220); sndEnemyDie(e); }
        else { addShake(3, 120); sndEnemyHit(e); }
        state.score += base * mult;
        pushNum(state, pl.x, pl.y, '-25', '#ff8844');
        pl.vy = -8 - Math.min(mult,5)*0.4;  // bounce a touch higher each chain
        sndJump(); if(mult>1) sndCombo(mult);   // only ring on a real chain (x2+), not every single stomp
        pushMsg(state, mult>1 ? ('👊 STOMP x'+mult+'!') : '👊 STOMP!', 700, '#ffee44', 'md');
        // Save nearby citizen
        state.level.citizens.forEach(c=>{
          if(c.saved||c.eaten) return;
          if(Math.abs(c.x - e.x) < 80){ saveCitizen(c, state); }
        });
      }
    });
  }

  // ── Win — reach the exit portal (the 'E' tile). Position-based so it works for a
  // horizontal run (E at the right edge) AND a vertical climb (E at the top).
  if(scene==='playing' && !s.level.boss){          // boss levels are won by defeating the boss
    const need = (s.level.gems||[]).length, got = s.gemsCollected||0;   // exit is gated on collecting the word-gems
    const exT = s.level.exit;
    const atExit = exT ? (pl.x+PW > exT.c*TS-8 && pl.x < exT.c*TS+TS+8 && pl.y+PH > exT.r*TS-8 && pl.y < exT.r*TS+TS+44)
                       : (pl.x > (LW-3)*TS);
    if(atExit){
      if(got >= need){ if(s.levelId==='w1secret') exitSecret(); else finishLevel(); }   // secret = carried back, not 'finish'
      else { s._gateMs = (s._gateMs||0) - dt; if(s._gateMs<=0){ s._gateMs=1400;   // throttled "locked" prompt
        pushMsg(s, '🔒 Collect '+(need-got)+' more 💎 word'+((need-got)>1?'s':'')+'!', 1300, '#ff9955', 'md'); } }
    }
    // ── Secret door — once FART-revealed, touch it to be carried into the hidden vocab room ──
    const d = s.level.door;
    if(d && !d.hidden && !d.used){ const dc=d.c*TS, dr=d.r*TS;
      if(pl.x+PW>dc-4 && pl.x<dc+TS+4 && pl.y+PH>dr-4 && pl.y<dr+TS+40){ d.used=true; enterSecret(); } }
  }
}
let _savedLevel = null;   // the level (w1l1) we'll be carried BACK to after the secret
function enterSecret(){
  if(scene!=='playing' || !state) return;
  meta.foundSecret = true; saveMeta();
  _savedLevel = state;
  _savedLevel._dropX = state.player.x;                 // drop back exactly where we left (works vertical + horizontal)
  _savedLevel._dropY = state.player.y;
  startCarry('in', ()=>{                              // winged monster carries you up & in
    const ch = _savedLevel.charKey;
    state = mkState(ch, 'w1secret'); state.startTick = tick; scene='playing';
    pushMsg(state, '🌟 SECRET ROOM!  Collect the words!', 2400, '#ffe14d', 'lg');
  });
}
function exitSecret(){    // reached the secret room's exit -> carried back into the level (NOT 'finish')
  startCarry('out', ()=>{
    const lvl = _savedLevel; _savedLevel = null;
    state = lvl;
    LW = lvl.level.LW; LH = lvl.level.LH;              // restore the level's global dims
    state.player.x = (lvl._dropX!=null ? lvl._dropX : state.player.x);
    state.player.y = (lvl._dropY!=null ? lvl._dropY - TS : (lvl.level.LH-5)*TS);   // a tile above where we left -> floats down
    state.player.vy = 0; state.player.invincMs = 1500; state.player.falling = false;
    scene = 'playing';
    pushMsg(state, '🪂 Dropped back in — keep going!', 2000, '#7CFF8A', 'md');
  });
}

function resolveX(pl, tiles, PW, PH){
  const dir = pl.vx > 0 ? 1 : -1;
  const checkX = pl.vx>0 ? pl.x+PW : pl.x;
  const col = Math.floor(checkX/TS);
  const r1  = Math.floor((pl.y+4)/TS);
  const r2  = Math.floor((pl.y+PH-4)/TS);
  for(const r of [r1,r2]){
    if(solid(tiles,r,col)){
      if(dir>0) pl.x=col*TS-PW; else pl.x=(col+1)*TS;
      pl.vx=0; break;
    }
  }
}

function resolveY(pl, tiles, PW, PH){
  const c1 = Math.floor((pl.x+4)/TS);
  const c2 = Math.floor((pl.x+PW-4)/TS);

  if(pl.vy >= 0){
    const feetRow = Math.floor((pl.y+PH)/TS);
    for(const c of [c1,c2]){
      if(solid(tiles,feetRow,c)){
        pl.y = feetRow*TS - PH; pl.vy=0; pl.onGround=true; break;
      }
      // One-way platform: only from above
      if(plat(tiles,feetRow,c) && pl.y+PH-pl.vy <= feetRow*TS){
        pl.y = feetRow*TS - PH; pl.vy=0; pl.onGround=true; break;
      }
    }
  } else if(pl.vy < 0){
    const headRow = Math.floor(pl.y/TS);
    for(const c of [c1,c2]){
      if(solid(tiles,headRow,c)){
        pl.y=(headRow+1)*TS; pl.vy=0; break;
      }
    }
  }
}

// ═══════════════════════════════════════════
//  FOOD / FART SYSTEM
// ═══════════════════════════════════════════
// Hidden gems — the per-round collectible that isn't food. Invisible until a fart
// reveals them (doFart flips g.hidden), then collected by touch like food.
function updateGems(dt, s){
  const pl = s.player, PW=44, PH=66;
  const gems = s.level.gems || [];
  gems.forEach(g=>{
    if(g.revealMs>0) g.revealMs = Math.max(0, g.revealMs - dt);
    if(g.collected || g.hidden) return;
    if(pl.x < g.x+18 && pl.x+PW > g.x-18 && pl.y < g.y+18 && pl.y+PH > g.y-18){
      g.collected = true; s.gemsCollected++;
      s.score += 250;
      const pool = _vocab(); const w = pool[(s.gemsCollected-1) % pool.length]; g.word = w;
      if(!playSample('jp_'+w.key+'_f', 1.0, 0)) sndGiggle();   // SPEAK the word this gem teaches
      _learn('v:'+w.key);
      pushNum(s, g.x, g.y-12, '+250', '#5ad6ff');
      pushMsg(s, '💎 '+w.jp+'  '+w.ro+' = '+w.en, 1700, '#5ad6ff', 'lg');   // teach + show the word
      if(s.gemsCollected >= gems.length) pushMsg(s, '🔓 GATE OPEN — reach the flag!', 1900, '#22ffaa', 'lg');
    }
  });
}
function updateFood(dt, s){
  const pl = s.player;
  const PW=44, PH=66;
  s.level.food.forEach(f=>{
    if(f.collected) return;
    // Collect when player overlaps
    if(pl.x < f.x+20 && pl.x+PW > f.x &&
       pl.y < f.y+20 && pl.y+PH > f.y){
      f.collected=true;
      sndEat(f.type);
      pl.eatAnim = 400;
      // Poppy gets bonus on banana
      const bonus = (s.charKey==='poppy' && f.type.name==='BANANA') ? 1.4 : 1;
      pl.fartMeter = Math.min(100, pl.fartMeter + f.type.gain * bonus);
      s.score += 50;
      pushMsg(s, f.type.emoji+' '+f.type.jp+'  '+f.type.ro+' = '+f.type.en, 1500, f.type.clr, 'lg');  // SEE the food's Japanese name (big), while it's spoken
      playSample('jp_'+f.type.key+'_f', 0.9, 0.04);    // speak the food word (girl hero's voice)
      _learn('f:'+f.type.key);                          // add to the word book
    }
  });
}

function saveCitizen(c, s){
  c.saved = true;
  c.savedTimer = 2200;                                  // long enough to read the phrase
  const v = _vocab();
  c.saying = v[_npcSayIdx++ % v.length];                // rotate: each rescue teaches a new word
  _learn('v:'+c.saying.key);                            // add to the word book
  s.savedCitizens++;
  const _g = NPC_GENDER[c.npc] || 'f';                 // voice matches the NPC's gender
  playSample('jp_'+c.saying.key+'_'+_g, 1.0, 0.05);    // ONLY the clean spoken word — no cheer/"321" over it
  s.score += 200;
  for(let i=0;i<8;i++) c.particles.push({
    vx:(Math.random()-0.5)*3, vy:-(Math.random()*3+1),
    life:800, maxLife:800,
    emoji:['💚','⭐','✨','💫'][i%4],
  });
  // Rescuing townsfolk is a BONUS (affects rank), not a win condition — the level ends only
  // at the exit. (Previously saving all auto-finished the level, which now ends it mid-run
  // since you rescue by walking into them.)
}

function doBite(s){
  const pl = s.player;
  if((pl.biteCooldown||0) > 0) return;
  pl.biteCooldown = 900;
  pl.eatAnim = 420;
  sndChomp(); sndRoar();   // crunchy chomp + the kaiju roar
  const range = 90;
  const cx = pl.x + (pl.dir > 0 ? 44+20 : -20);
  let hit = false;
  s.level.enemies.forEach(e=>{
    if(e.dead) return;
    const ec = e.x + eW(e)/2;
    if(Math.abs(ec - cx) < range){
      e.hp -= 20; e.stunMs = 700; e.flashMs = 250;
      pushNum(s, e.x, e.y-10, '-20', '#ffee44');
      if(e.hp<=0){ e.dead=true; s.score+=enemyBig(e)?200:80; addShake(4,150); sndEnemyDie(e); }
      else { addShake(2,80); sndEnemyHit(e); }
      hit = true;
      // Save adjacent citizen
      s.level.citizens.forEach(c=>{
        if(c.saved||c.eaten) return;
        if(Math.abs(c.x - e.x) < 60) saveCitizen(c, s);
      });
    }
  });
  pushMsg(s, hit?'💥 CHOMP!':'🦖 ROAR!', 600, hit?'#ffee44':'#aaffaa', 'md');
}

function doFart(s){
  const pl = s.player;
  const size = pl.fartMeter >= 80 ? 3 : pl.fartMeter >= 50 ? 2 : 1;
  pl.fartAnim = [0,500,1000,2500][size];
  const saying = FART_SAYINGS[Math.floor(Math.random()*FART_SAYINGS.length)];
  pushMsg(s, saying, [0,1200,1800,3000][size], ['','#88ffaa','#44ff88','#00ff66'][size], 'lg');
  sndFart(size);
  // The kaiju girls giggle on every fart (delayed so it rings out after the fart blast,
  // not buried under it).
  sndGiggle(0.95);   // play the giggle cleanly AFTER the 0.9s fart finishes, not over it

  const radius = [0,80,160,260][size];
  s.fartCloud = { x:pl.x+22, y:pl.y+50, r:0, maxR:radius, size, timer:[0,600,1100,2600][size] };

  // Fart reveals nearby HIDDEN gems (the collectible that isn't food)
  const fcx = pl.x+22, fcy = pl.y+50;
  (s.level.gems||[]).forEach(g=>{
    if(g.collected || !g.hidden) return;
    const dx=g.x-fcx, dy=g.y-fcy;
    if(Math.sqrt(dx*dx+dy*dy) < radius+24){ g.hidden=false; g.revealMs=600; pushNum(s, g.x, g.y-14, '✨', '#ffe14d'); }
  });
  // Fart also reveals the hidden SECRET DOOR (so it's a real find, not a freebie)
  const dr=s.level.door;
  if(dr && dr.hidden){ const ddx=dr.c*TS+TS/2-fcx, ddy=dr.r*TS+TS/2-fcy;
    if(Math.sqrt(ddx*ddx+ddy*ddy) < radius+30){ dr.hidden=false; addShake(4,200); pushMsg(s, '🌟 A SECRET DOOR appeared!', 2000, '#c66bff', 'lg'); } }

  // Stun / kill enemies in radius — and rescue nearby citizens
  s.level.enemies.forEach(e=>{
    if(e.dead) return;
    const ex = e.x + (enemyBig(e)?14:8);
    const ey = e.y + (enemyBig(e)?9:19);
    const dx = ex - (pl.x+22), dy = ey - (pl.y+50);
    if(Math.sqrt(dx*dx+dy*dy) < radius){
      e.stunMs = [0,1500,3000,6000][size];
      const bigEnemy = enemyBig(e);
      const fartDmg = [0,15,30,99][size];
      if(size===3){ e.hp=0; e.dead=true; s.score+=bigEnemy?300:100; addShake(8,350); sndEnemyDie(e); }
      else { e.hp -= fartDmg; if(e.hp<=0){ e.dead=true; s.score+=bigEnemy?300:100; addShake(5,200); sndEnemyDie(e); } else { addShake(3,120); sndEnemyHit(e); } }
      pushNum(s, e.x, e.y-10, '-'+fartDmg, '#44ff88');
      // Save citizens near this enemy
      s.level.citizens.forEach(c=>{
        if(c.saved||c.eaten) return;
        if(Math.abs(c.x - e.x) < 90) saveCitizen(c, s);
      });
    }
  });

  pl.fartMeter = Math.max(0, pl.fartMeter - [0,30,55,100][size]);
}

function updateFartCloud(dt, s){
  if(!s.fartCloud) return;
  const fc = s.fartCloud;
  fc.timer -= dt;
  fc.r = Math.min(fc.maxR, fc.r + dt * 0.22);
  if(fc.timer <= 0) s.fartCloud = null;
}

function updateEnemies(dt, s){
  const pl = s.player;
  const PW=44, PH=66;
  s.level.enemies.forEach(e=>{
    if(e.dead) return;
    e.flashMs = Math.max(0, (e.flashMs||0)-dt);
    e.stunMs  = Math.max(0, e.stunMs-dt);
    if(e.stunMs > 0) return;  // stunned, don't move

    // Difficulty-scaled movement: later levels patrol faster, chase from farther, hunt harder.
    const d = s.diff || 1;
    const patrolSpd = (enemyBig(e) ? 0.7 : 1.1) * (1 + 0.18*(d-1));
    const chaseRange = 90 + 34*d;                       // how close before it locks on
    const chaseSpd   = patrolSpd * 2.0;
    const dxP = pl.x - e.x, sameLevel = Math.abs(pl.y - e.y) < 50;
    if(sameLevel && Math.abs(dxP) < chaseRange){
      // Hunt the player (clamped to its patrol span so it won't walk off a ledge)
      e.dir = dxP > 0 ? 1 : -1;
      e.x += chaseSpd * e.dir;
      e.chaseMs = 200;
    } else {
      e.x += patrolSpd * e.dir;                          // normal patrol
    }
    if(e.x <= e.patrol[0]){ e.x=e.patrol[0]; e.dir=1; }
    if(e.x+eW(e) >= e.patrol[1]){ e.x=e.patrol[1]-eW(e); e.dir=-1; }

    // Hurt player on contact
    if(pl.invincMs<=0){
      const ex=e.x, ey=e.y, ew=eW(e), eh=eH(e);
      if(pl.x<ex+ew && pl.x+PW>ex && pl.y<ey+eh && pl.y+PH>ey){
        pl.hp = Math.max(0, pl.hp-12);
        s.hitsTaken++;
        pl.invincMs = 1400;
        pl.vx = pl.x < ex ? -5 : 5;
        pl.vy = -4;
        addShake(4, 180);
        pushNum(s, pl.x, pl.y-20, '-12', '#ff3333');
        sndHurt();
      }
    }
  });
}

function updateCitizens(dt, s){
  s.level.citizens.forEach(c=>{
    c.eatenTimer = Math.max(0, c.eatenTimer - dt);
    c.savedTimer = Math.max(0, c.savedTimer - dt);
    c.particles = c.particles.filter(p=>{
      p.life -= dt; p.x = (p.x||0) + p.vx; p.y = (p.y||0) + p.vy; p.vy += 0.05;
      return p.life > 0;
    });
    if(c.saved || c.eaten) return;

    // Walk into a townsfolk to rescue them (intuitive + always reachable, unlike the
    // old "defeat an enemy next to them" which was impossible once they were spaced apart).
    const pl = s.player;
    if(pl.x < c.x+30 && pl.x+44 > c.x-30 && pl.y < c.y+30 && pl.y+66 > c.y-30){ saveCitizen(c, s); return; }   // forgiving reach for kids

    // Run away from the nearest active enemy that's on roughly the same level — an enemy
    // far above/below (a rooftop vs the street) isn't a threat, so it shouldn't cause panic.
    let nearestDist = Infinity, nearestDx = 0;
    s.level.enemies.forEach(e=>{
      if(e.dead) return;
      if(Math.abs(e.y - c.y) > 80) return;
      const dx = e.x - c.x;
      const d = Math.abs(dx);
      if(d < nearestDist){ nearestDist=d; nearestDx=dx; }
    });
    const panic = nearestDist < 150;
    const lo = TS, hi = (LW-2)*TS;
    if(panic){
      // Commit to ONE flee direction when the scare starts and keep it — re-picking the
      // away-from-nearest direction every frame made trapped citizens ping-pong (gyrate).
      if(!c.fleeing){ c.fleeing = true; c.dir = nearestDx > 0 ? -1 : 1; }
      const nx = c.x + c.dir * 1.2;
      if(nx > lo && nx < hi){ c.x = nx; c.moving = true; }
      else { c.moving = false; }            // cornered against a wall: cower in place, don't jitter
    } else {
      c.fleeing = false; c.moving = false;  // safe: stand still and wait for rescue
    }

    // Enemy catches citizen
    s.level.enemies.forEach(e=>{
      if(e.dead || e.stunMs>0 || c.eaten) return;
      // Must be at roughly the same height (vertical levels: ground enemy can't eat
      // a citizen on a rooftop just because they share an x column).
      if(Math.abs(e.x + eW(e)/2 - c.x) < 20 && Math.abs(e.y - c.y) < 40){
        c.eaten = true;
        c.eatenTimer = 600;
        s.lostCitizens++;
        pushMsg(s, '😱 CITIZEN EATEN!', 1400, '#ff4444', 'md');
        if(s.lostCitizens >= 3 && scene==='playing'){ scene='gameover'; sndGameOver(); }
      }
    });
  });
}

function eW(e){ return enemyBig(e)?36:20; }
function eH(e){ return enemyBig(e)?28:36; }

function pushMsg(s, text, ms, clr, size){
  s.msgs.push({ text, timer:ms, maxTimer:ms, clr:clr||'#ffffff', size:size||'sm' });
}
function pushNum(s, x, y, text, clr){
  s.dmgNums.push({ x, y, text, clr:clr||'#ffee44', life:800, maxLife:800 });
}

// ═══════════════════════════════════════════
//  BACKGROUND DRAWING
// ═══════════════════════════════════════════
function drawBg(cam){
  // ── Image backdrop (per world). Falls back to a flat day sky until the image loads. ──
  // World is derived from the active level id (w<N>l<M>); only World 1 art exists for now.
  const world = (state && state.levelId) ? state.levelId.charAt(1) : '1';
  const bgImg = loadedSprites['bg_w' + world];
  if(bgImg){
    const pf = 0.35;                       // parallax: backdrop drifts slower than camera
    let ox = (cam.x * pf) % VW;
    if(ox < 0) ox += VW;
    // Vertical parallax: the backdrop is drawn taller than the viewport and pans with
    // cam.y, so climbing reveals more sky up top and the street stays at the bottom.
    const drawH = VH * 1.5;
    const camYMax = Math.max(1, LH*TS - VH);
    const oy = -((cam.y / camYMax) * (drawH - VH));   // 0 (sky) at top, -(drawH-VH) (street) at bottom
    ctx.drawImage(bgImg, -ox, oy, VW, drawH);
    ctx.drawImage(bgImg, VW - ox, oy, VW, drawH);
    // Graduated scrim over the play band so foreground sprites read clearly against
    // the busy street-level art — darkest at the very bottom, fading out by mid-screen.
    const scrim = ctx.createLinearGradient(0, VH - 170, 0, VH);
    scrim.addColorStop(0,    'rgba(8,12,28,0)');
    scrim.addColorStop(0.55, 'rgba(8,12,28,0.32)');
    scrim.addColorStop(1,    'rgba(8,12,28,0.52)');
    ctx.fillStyle = scrim; ctx.fillRect(0, VH - 170, VW, 170);
    return;
  }

  // ── Loading fallback: flat day sky (only until the world backdrop image loads) ──
  const sky = ctx.createLinearGradient(0,0,0,VH);
  sky.addColorStop(0,'#7ec8f0'); sky.addColorStop(1,'#cfeaff');
  ctx.fillStyle=sky; ctx.fillRect(0,0,VW,VH);
}

function bgLayer(offset, bldClr, roofClr, maxH, maxW, winAlpha){
  const seed=[0,55,130,190,265,330,400,468,540,610,680,750];
  seed.forEach((bx,i)=>{
    const h = maxH*(0.6+((bx*7+i*13)%100)/250);
    const w = maxW*(0.7+((bx*3+i*11)%100)/300);
    const wx = ~~(((bx-offset)%(VW+maxW)+VW+maxW)%(VW+maxW)-maxW);
    ctx.fillStyle=bldClr; ctx.fillRect(wx, VH-h, w, h);
    ctx.fillStyle=roofClr; ctx.fillRect(wx, VH-h, w, 3);  // roofline
    ctx.fillStyle=`rgba(255,210,120,${winAlpha})`;
    const cols=Math.floor(w/9), rows=3;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if((r*cols+c+i)%3!==0) ctx.fillRect(wx+2+c*8, VH-h+5+r*10, 4, 5);
    }
  });
}
// ═══════════════════════════════════════════
//  TILE DRAWING
// ═══════════════════════════════════════════
function drawTiles(s){
  const cam = s.cam;
  const tiles = s.level.tiles;
  const sc = Math.floor(cam.x/TS)-1;
  const ec = Math.min(LW, sc + Math.floor(VW/TS)+3);

  for(let r=0;r<LH;r++){
    const row = tiles[r]; if(!row) continue;          // guard: never index past the row count during a level/scene swap
    for(let c=Math.max(0,sc);c<ec;c++){
      const t = row[c];
      if(t===T_AIR) continue;
      const px=~~(c*TS-cam.x), py=~~(r*TS-cam.y);

      if(t===T_SOLID){
        ctx.fillStyle='#4a3a22'; ctx.fillRect(px,py,TS,TS);           // darker wall — separates from the warm backdrop
        ctx.fillStyle='#d8b566'; ctx.fillRect(px,py,TS,3);            // bright walkable top edge (reads at a glance)
        ctx.fillStyle='#8a6d3e'; ctx.fillRect(px,py+3,TS,2);          // warm under-glow
        ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fillRect(px,py+TS-4,TS,4);
        ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=1; ctx.strokeRect(px+0.5,py+0.5,TS-1,TS-1);  // crisp outline
      } else if(t===T_PLAT){
        ctx.fillStyle='#7a3527'; ctx.fillRect(px,py,TS,9);            // rooftop slab (taller, darker body)
        ctx.fillStyle='#ff9a5c'; ctx.fillRect(px,py,TS,3);            // bright landable lip
        ctx.fillStyle='rgba(0,0,0,0.30)'; ctx.fillRect(px,py+9,TS,3); // shadow beneath the lip
      } else if(t===T_DEST){
        ctx.fillStyle='#a9762e'; ctx.fillRect(px+1,py+1,TS-2,TS-2);   // wooden crate
        ctx.strokeStyle='#6e4a18'; ctx.lineWidth=2; ctx.strokeRect(px+2,py+2,TS-4,TS-4);
        ctx.beginPath(); ctx.moveTo(px+2,py+2); ctx.lineTo(px+TS-2,py+TS-2);
        ctx.moveTo(px+TS-2,py+2); ctx.lineTo(px+2,py+TS-2); ctx.stroke();
      } else if(t===T_HAZARD){
        ctx.fillStyle='#3a3f4a'; ctx.fillRect(px,py+TS-6,TS,6);       // base
        ctx.fillStyle='#c8ccd4';                                      // metal spikes
        for(let k=0;k<4;k++){ const sx=px+k*8;
          ctx.beginPath(); ctx.moveTo(sx,py+TS-6); ctx.lineTo(sx+4,py+10); ctx.lineTo(sx+8,py+TS-6); ctx.fill(); }
      } else if(t===T_SHOCK){
        const st=_shockState(), T4=Date.now();
        ctx.fillStyle='#1a1630'; ctx.fillRect(px,py,TS,TS);                           // dark electrified plate (full tile)
        ctx.fillStyle='#0a0820'; for(let k=0;k<4;k++) ctx.fillRect(px+3+k*8,py+6,3,TS-10);   // grooves
        if(st==='on'){
          ctx.save(); ctx.shadowColor='#5ad6ff'; ctx.shadowBlur=12;
          ctx.fillStyle='#bdefff'; ctx.fillRect(px,py,TS,4);                          // bright LIVE surface (where the feet are)
          ctx.strokeStyle='#5ad6ff'; ctx.lineWidth=2; ctx.beginPath();                // crackling arc along the top
          ctx.moveTo(px,py+4); for(let k=0;k<=4;k++) ctx.lineTo(px+k*8, py+4+((k+~~(T4*0.02))%2?6:-3));
          ctx.stroke(); ctx.restore();
        } else if(st==='warn'){
          const a=0.4+0.4*Math.abs(Math.sin(T4*0.02));
          ctx.fillStyle='rgba(90,214,255,'+a.toFixed(2)+')'; ctx.fillRect(px,py,TS,4);   // charging flicker
        } else {
          ctx.fillStyle='#2a4a5a'; ctx.fillRect(px,py,TS,3);                          // dim/safe surface tube
        }
      }
    }
  }
}

// ═══════════════════════════════════════════
//  FOOD DRAWING
// ═══════════════════════════════════════════
function drawGems(s){
  const cam = s.cam, t = Date.now()*0.004;
  (s.level.gems||[]).forEach(g=>{
    if(g.collected) return;
    const gx=~~(g.x-cam.x), gy=~~(g.y-cam.y+Math.sin(t+g.bob)*3);
    ctx.textAlign='center';
    if(g.hidden){
      // faint shimmer hint — barely-there sparkle so players know to fart here
      const a = 0.10 + 0.08*Math.abs(Math.sin(t*0.7+g.bob));
      ctx.globalAlpha=a; ctx.font='12px serif'; ctx.fillText('✨', gx, gy);
      ctx.globalAlpha=1;
    } else {
      // revealed gem: glow ring + bright gem, extra pop right after reveal
      const pop = g.revealMs>0 ? 1.4 : 1;
      ctx.fillStyle='rgba(90,214,255,0.25)';
      ctx.beginPath(); ctx.arc(gx, gy, (12+Math.sin(t*2+g.bob)*2)*pop, 0, Math.PI*2); ctx.fill();
      ctx.font=Math.round(22*pop)+'px serif'; ctx.fillText('💎', gx, gy+8);
    }
    ctx.textAlign='left';
  });
}
function drawFood(s){
  const t = Date.now()*0.003;
  const cam = s.cam;
  ctx.font='20px serif';
  ctx.textAlign='center';
  s.level.food.forEach((f,i)=>{
    if(f.collected) return;
    const fx=~~(f.x-cam.x+10), fy=~~(f.y-cam.y+Math.sin(t+f.bobOff)*4);
    // Glow ring
    ctx.fillStyle=f.type.clr+'33';
    ctx.beginPath();
    ctx.arc(fx, fy+10, 14+Math.sin(t+f.bobOff)*2, 0, Math.PI*2);
    ctx.fill();
    const img = loadedSprites['food_'+f.type.key];
    if(img){
      const SZ = 26;
      _drawSprite('food_'+f.type.key, fx - SZ/2, fy + 10 - SZ/2, SZ, SZ, 1, false);
    } else {
      ctx.fillText(f.type.emoji, fx, fy+15);   // fallback until sprite loads
    }
  });
  ctx.textAlign='left';
}

// ═══════════════════════════════════════════
//  ENEMY DRAWING
// ═══════════════════════════════════════════
function drawEnemies(s){
  s.level.enemies.forEach(e=>{
    if(e.dead) return;
    const ex=~~(e.x-s.cam.x), ey=~~(e.y-s.cam.y);
    const fl=(e.flashMs||0)>0;
    const st=e.stunMs>0;
    const dir=e.dir;

    drawEnemy(e, ex, ey, dir, fl, st);

    // HP bar
    if(e.hp<e.maxHp){
      const bw=enemyBig(e)?36:20;
      ctx.fillStyle='#1a0a0a'; ctx.fillRect(ex, ey-6, bw, 3);
      ctx.fillStyle=e.hp>e.maxHp*0.5?'#22cc22':'#cc4400';
      ctx.fillRect(ex, ey-6, Math.round(bw*e.hp/e.maxHp), 3);
    }

    // Stun stars
    if(st){
      ctx.font='10px serif'; ctx.textAlign='center';
      const bx=ex+(enemyBig(e)?18:10);
      for(let i=0;i<3;i++){
        const a=Date.now()*0.005+i*2.1;
        ctx.fillText('⭐', bx+Math.cos(a)*10, ey-14+Math.sin(a)*4);
      }
      ctx.textAlign='left';
    }
  });
}

function drawCitizens(s){
  const cam = s.cam;
  const t = Date.now();
  s.level.citizens.forEach(c=>{
    const cx2 = ~~(c.x - cam.x);
    const cy2 = ~~(c.y - cam.y);

    // Particle effects (saved sparkles)
    c.particles.forEach(p=>{
      const alpha2 = p.life/p.maxLife;
      ctx.globalAlpha = alpha2;
      ctx.font='10px serif'; ctx.textAlign='center';
      ctx.fillText(p.emoji, cx2+(p.x||0), cy2+(p.y||0));
    });
    ctx.globalAlpha=1; ctx.textAlign='left';

    if(c.eaten && c.eatenTimer>0){
      // Show poof when eaten
      ctx.font='16px serif'; ctx.textAlign='center';
      ctx.globalAlpha = c.eatenTimer/600;
      ctx.fillText('💀', cx2, cy2-8);
      ctx.globalAlpha=1; ctx.textAlign='left';
      return;
    }
    if(c.saved){
      if(c.savedTimer>0){
        const a = Math.min(1, c.savedTimer/500);        // hold, then fade out in the last 500ms
        const sy = c.saying;
        ctx.textAlign='center'; ctx.globalAlpha=a;
        ctx.font='14px serif'; ctx.fillText('🎉', cx2, cy2+4);   // celebrate on the NPC
        if(sy){
          // speech bubble sized to the text
          ctx.font='bold 12px sans-serif'; const w1=ctx.measureText(sy.jp).width;
          ctx.font='8px monospace';        const w2=ctx.measureText(sy.ro+'  ·  '+sy.en).width;
          const bw=Math.max(w1,w2)+18, bh=30, bx=cx2-bw/2, byT=cy2-56;
          ctx.fillStyle='rgba(255,255,255,0.97)'; ctx.strokeStyle='#1faa55'; ctx.lineWidth=2;
          rrect(bx,byT,bw,bh,7); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx2-6,byT+bh-1); ctx.lineTo(cx2+6,byT+bh-1); ctx.lineTo(cx2,byT+bh+7); ctx.closePath();
          ctx.fillStyle='rgba(255,255,255,0.97)'; ctx.fill();
          ctx.fillStyle='#d11f55'; ctx.font='bold 12px sans-serif'; ctx.fillText(sy.jp, cx2, byT+14);     // kana
          ctx.fillStyle='#1f7a44'; ctx.font='8px monospace';        ctx.fillText(sy.ro+'  ·  '+sy.en, cx2, byT+25); // romaji · meaning
        }
        ctx.globalAlpha=1; ctx.textAlign='left';
      }
      return;
    }

    // Fleeing citizen — one of the 8 named townsfolk (NPC sprite), bobbing as it runs.
    // Stride-hop tied to actual movement (phase advances with x), and perfectly still
    // when stopped — no constant time-based vibration.
    const bob  = c.moving ? Math.abs(Math.sin(c.x*0.12)) * 1.6 : 0;
    const flip = c.dir < 0;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx2, cy2+20, 9, 3, 0, 0, Math.PI*2); ctx.fill();
    const npcKey = 'npc_' + (c.npc || 'salaryman');
    const img = loadedSprites[npcKey];
    if(img){
      const NH = 34;                                    // in-game citizen height
      const NW = NH * (img.naturalWidth / img.naturalHeight);
      _drawSprite(npcKey, cx2 - NW/2, cy2 + 22 - NH + bob, NW, NH, flip ? -1 : 1, false);
    } else {
      ctx.fillStyle = c.clr || '#ffd8a8';               // fallback until sprite loads
      ctx.fillRect(cx2-6, cy2+bob, 12, 18);
    }

    // "HELP!" bubble above
    const nearDist = s.level.enemies.reduce((mn,e)=>e.dead?mn:Math.min(mn,Math.abs(e.x-c.x)), Infinity);
    if(nearDist < 140){
      const bubbleAlpha = Math.min(1, (140-nearDist)/80);
      ctx.globalAlpha=bubbleAlpha;
      ctx.fillStyle='white'; ctx.strokeStyle='#cc2200'; ctx.lineWidth=1;
      ctx.fillRect(cx2-18, cy2-38, 36, 14);
      ctx.strokeRect(cx2-18, cy2-38, 36, 14);
      ctx.fillStyle='#cc2200'; ctx.font='bold 7px monospace'; ctx.textAlign='center';
      ctx.fillText('HELP! 😱', cx2, cy2-27);
      ctx.globalAlpha=1; ctx.textAlign='left';
    }
  });
}

function _kaijuKey(char, pl, tick){
  if(pl.eatAnim>0)  return char+'_eat_'+(Math.floor(tick/6)%2+1);
  if(pl.fartAnim>0) return char+'_fart_'+(Math.floor(tick/8)%2+1);
  if(!pl.onGround)  return char+'_jump';
  if(Math.abs(pl.vx)>0.3) return char+'_walk_'+(Math.floor(tick/8)%4+1);
  return char+'_idle';
}

// Cached white silhouette of a sprite, so a hit-flash follows the character shape
// instead of painting a square over its bounding box.
const _whiteMaskCache = new Map();
function _whiteMask(img){
  let m = _whiteMaskCache.get(img);
  if(!m){
    m = document.createElement('canvas');
    m.width = img.naturalWidth || img.width; m.height = img.naturalHeight || img.height;
    const mx = m.getContext('2d');
    mx.drawImage(img, 0, 0);
    mx.globalCompositeOperation = 'source-in';   // keep only the sprite's opaque pixels
    mx.fillStyle = '#ffffff'; mx.fillRect(0, 0, m.width, m.height);
    _whiteMaskCache.set(img, m);
  }
  return m;
}
function _drawSprite(key, x, y, w, h, dir, flash){
  const img = loadedSprites[key]; if(!img) return;
  x=Math.round(x); y=Math.round(y);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if(dir<0){
    ctx.translate(x+w,y); ctx.scale(-1,1);
    ctx.drawImage(img,0,0,w,h);
    if(flash){ ctx.globalAlpha=0.6; ctx.drawImage(_whiteMask(img),0,0,w,h); }
  } else {
    ctx.drawImage(img,x,y,w,h);
    if(flash){ ctx.globalAlpha=0.6; ctx.drawImage(_whiteMask(img),x,y,w,h); }
  }
  ctx.restore();
}

// Generic enemy draw: looks up the ENEMIES registry and anchors the sprite at the feet
// (spawn ground line is 38px below e.y). x,y are screen coords. Enemies render at their FIXED
// size (matching their hitbox) — so as the kaiju GROWS it visibly towers over the city creatures
// (the spatial power-fantasy). Don't reintroduce _kaijuScale() here.
const ENEMY_FOOT = 38;
function drawEnemy(e, x, y, dir, flash, stun){
  const def = ENEMIES[e.type] || ENEMIES.slime;
  const key = 'en_' + (ENEMIES[e.type] ? e.type : 'slime');
  const sw  = def.w, sh = def.h;             // fixed size (= hitbox), NOT scaled by the kaiju's growth
  const cx  = x + (enemyBig(e) ? 18 : 10);    // horizontal centre over the hitbox
  const dx  = cx - sw/2;
  const dy  = (y + ENEMY_FOOT) - sh;          // feet planted on the ground line
  // Brief white silhouette on hit (via flashMs); stun is shown by the ⭐ stars only —
  // no orange box over the sprite (that read as a square around the enemy).
  _drawSprite(key, dx, dy, sw, sh, dir, flash);
}

// ═══════════════════════════════════════════
//  KAIJU SPRITES  (16-bit SNES style)
// ═══════════════════════════════════════════
// Physical growth: the kaiju visibly scales up with meta.growthStage
// (Hatchling → Apex). Sprite is anchored at the feet so it grows upward.
// Per-stage redesigned art (pink-frilled Lulah etc.) is a follow-on; this
// reuses the existing animation frames at a stage-driven scale.
// Spatial growth: hatchling stays baby-sized; each stage gets visibly bigger so an Apex kaiju TOWERS
// over the fixed-size city creatures (the "you became a giant" power fantasy).
const GROWTH_SCALE = [0.6, 0.85, 1.15, 1.5, 1.95];
function _kaijuScale(){ return GROWTH_SCALE[(meta && meta.growthStage) || 0] || 1; }
function _drawKaijuSprite(key, bx, by, dir){
  const img = loadedSprites[key];
  const h  = 64 * _kaijuScale();                 // drawn height (grows with the kaiju)
  // Keep the frame's real aspect — the SNES frames aren't square; forcing a square
  // both squished the hero and (with the old 64px anchor) floated it above the ground.
  const w  = img ? h * (img.naturalWidth / img.naturalHeight) : h;
  // Plant the feet on the hitbox bottom: by = screenY-4, hitbox is 66 tall -> by+70.
  _drawSprite(key, (bx + 32) - w/2, (by + 70) - h, w, h, dir, false);
}
function drawLulah(x, y, pl, tick){
  const invinc = (pl.invincMs||0)>0 && Math.floor(Date.now()/80)%2===0;
  if(invinc){ ctx.save(); ctx.globalAlpha=0.3; }
  _drawKaijuSprite(_kaijuKey('lulah',pl,tick), x-10, y-4, pl.dir);
  if(invinc) ctx.restore();
}
function drawPoppy(x, y, pl, tick){
  const invinc = (pl.invincMs||0)>0 && Math.floor(Date.now()/80)%2===0;
  if(invinc){ ctx.save(); ctx.globalAlpha=0.3; }
  _drawKaijuSprite(_kaijuKey('poppy',pl,tick), x-9, y-4, pl.dir);
  if(invinc) ctx.restore();
}
// ═══════════════════════════════════════════
//  FART CLOUD DRAWING
// ═══════════════════════════════════════════
function drawFartCloud(s){
  const fc = s.fartCloud;
  if(!fc) return;
  const prog = fc.timer / ([0,600,1100,2600][fc.size]);
  const alpha = Math.min(prog*2, 1) * 0.65;
  const cx = ~~(fc.x - s.cam.x);
  const cy = ~~(fc.y - s.cam.y);

  // Multi-ring expanding cloud
  for(let i=0;i<3;i++){
    const rp = (fc.r/fc.maxR) * (1-i*0.25);
    const cr = fc.r*(1-i*0.2);
    const clr = fc.size===3 ? `rgba(80,255,80,${alpha*(1-i*0.3)})` :
                fc.size===2 ? `rgba(120,220,80,${alpha*(1-i*0.3)})` :
                              `rgba(160,220,100,${alpha*(1-i*0.3)})`;
    ctx.strokeStyle=clr; ctx.lineWidth=fc.size*3-i*2;
    ctx.shadowColor=fc.size===3?'#22ff44':'#88cc44';
    ctx.shadowBlur=fc.size===3?18:8;
    ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.stroke();
  }
  ctx.shadowBlur=0;

  // Puff particles
  if(fc.size>=2){
    ctx.globalAlpha=alpha*0.4;
    ctx.fillStyle=fc.size===3?'#44ff66':'#88cc44';
    const t=Date.now()*0.002;
    for(let i=0;i<6;i++){
      const a=t*1.5+i*1.05;
      const pr=fc.r*0.7;
      ctx.beginPath();
      ctx.arc(cx+Math.cos(a)*pr, cy+Math.sin(a)*pr, 8+fc.size*3, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // Cute emoji particles floating in cloud
  ctx.globalAlpha = alpha * 0.9;
  const emojis = fc.size===3 ? ['💨','💚','⭐','🌟','💫','😝'] :
                 fc.size===2 ? ['💨','💚','⭐','😄'] : ['💨','💚'];
  const t2=Date.now()*0.001;
  for(let i=0;i<emojis.length;i++){
    const a2 = t2*0.8 + i*1.05;
    const er = fc.r*(0.3+i*0.12);
    const ex2 = cx + Math.cos(a2)*er;
    const ey2 = cy + Math.sin(a2)*er*0.6 - i*4;
    ctx.font=`${8+fc.size*4}px serif`;
    ctx.textAlign='center';
    ctx.fillText(emojis[i], ex2, ey2);
  }
  ctx.globalAlpha=1; ctx.textAlign='left';

  // BRRRAP text for big fart
  if(fc.size===3){
    ctx.font='bold 14px monospace'; ctx.textAlign='center';
    ctx.fillStyle=`rgba(100,255,100,${alpha*0.9})`;
    ctx.shadowColor='#44ff44'; ctx.shadowBlur=10;
    ctx.fillText('BRRRAAAP! 💨', cx, cy - fc.r*0.8);
    ctx.shadowBlur=0; ctx.textAlign='left';
  }

  // Squiggly lines for big fart
  if(fc.size===3){
    ctx.strokeStyle='rgba(100,255,100,0.5)';
    ctx.lineWidth=2;
    for(let i=0;i<4;i++){
      const a=i*1.57+Date.now()*0.001;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      for(let j=1;j<=8;j++){
        const r=fc.r*(j/8);
        ctx.lineTo(cx+Math.cos(a+j*0.4)*r, cy+Math.sin(a+j*0.3)*r);
      }
      ctx.stroke();
    }
  }
}

//  HUD  (minimal — just what matters)

function drawHUD(s){
  const pl = s.player;

  // ── HP bar (top left) ──
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(6,6,90,12);
  const hpClr = pl.hp>60?'#22cc22':pl.hp>30?'#cc9900':'#cc2200';
  ctx.fillStyle=hpClr; ctx.fillRect(7,7,Math.round(88*pl.hp/pl.maxHp),10);
  ctx.strokeStyle='#334433'; ctx.lineWidth=1; ctx.strokeRect(6,6,90,12);
  ctx.fillStyle=hpClr; ctx.font='bold 7px monospace';
  ctx.fillText('HP', 8, 5);

  // ── Level timer (under HP) — green while under par (the ⏱ speed-star target), amber once over ──
  const tSec = Math.max(0, Math.round((tick - (s.startTick||tick))/60));
  const par  = LEVEL_PAR[s.levelId] || 60;
  const mm = Math.floor(tSec/60), ss = tSec%60;
  ctx.font='bold 10px monospace'; ctx.textAlign='left';
  ctx.fillStyle = tSec<=par ? '#7CFF8A' : '#ff8855';
  ctx.fillText('⏱ '+mm+':'+(ss<10?'0':'')+ss+'  /'+par+'s', 6, 32);

  // ── FART METER (center top, big and prominent) ──
  const fm = pl.fartMeter/100;
  const mW=180, mX=VW/2-mW/2, mY=5;
  // Background
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(mX-2,mY-2,mW+4,18);
  // Gradient fill
  const grad = ctx.createLinearGradient(mX,0,mX+mW,0);
  grad.addColorStop(0,'#336622'); grad.addColorStop(0.5,'#66cc22'); grad.addColorStop(1,fm>=0.8?'#22ff66':'#aaee44');
  ctx.fillStyle=grad; ctx.fillRect(mX,mY,Math.round(mW*fm),14);
  // Segmented ticks
  ctx.fillStyle='rgba(0,0,0,0.3)';
  for(let i=1;i<5;i++) ctx.fillRect(mX+mW*(i/5),mY,1,14);
  // Border (glows when ready)
  if(fm>=0.2){ ctx.shadowColor='#44ff44'; ctx.shadowBlur=8; }
  ctx.strokeStyle=fm>=0.2?'#44cc44':'#224422'; ctx.lineWidth=1;
  ctx.strokeRect(mX-2,mY-2,mW+4,18); ctx.shadowBlur=0;
  // Label
  ctx.textAlign='center'; ctx.font='bold 8px monospace';
  ctx.fillStyle = fm>=0.2 ? '#aaffaa' : '#446644';
  const fartLbl = fm>=1?'💨 MEGA FART READY! [Z]': fm>=0.5?'💨 FART [Z]': fm>=0.2?'💨 MINI FART [Z]':'🦖 CHOMP [Z]  •  eat food to charge fart!';
  ctx.fillText(fartLbl, VW/2, mY-1);
  ctx.textAlign='left';

  // ── Citizen rescue counter (top right) ──
  const total = s.level.citizens.length;
  const saved = s.savedCitizens;
  const lost  = s.lostCitizens;
  ctx.textAlign='right';
  ctx.font='bold 8px monospace';
  let yrow = 26;
  if(total > 0){   // no rescue counter in the boss arena (0 citizens) — it read as "SAVED 0/0"
    ctx.fillStyle='#22ffaa';
    ctx.fillText('👥 SAVED: '+saved+'/'+total, VW-6, yrow); yrow += 12;
  }
  if(lost>0){
    ctx.fillStyle='#ff4444';
    ctx.fillText('💀 LOST: '+lost+'/3', VW-6, yrow); yrow+=12;
  }
  const gemTotal = (s.level.gems||[]).length;
  if(gemTotal>0){
    const done = s.gemsCollected>=gemTotal;
    ctx.fillStyle = done?'#22ffaa':'#5ad6ff';
    ctx.fillText((done?'🔓 WORDS: ':'💎 WORDS: ')+s.gemsCollected+'/'+gemTotal, VW-6, yrow); yrow+=12;
  }
  // Score
  ctx.fillStyle='#ffdd44'; ctx.fillText('★ '+s.score, VW-6, yrow);
  ctx.textAlign='left';

  // ── Stomp hint (first time only) ──
  if(!s._stompHinted && s.player.onGround && s.level.enemies.some(e=>!e.dead)){
    s._stompHinted=true;
  }

  // ── Floating messages ──
  s.msgs.forEach((m,i)=>{
    ctx.globalAlpha = Math.min((m.timer/m.maxTimer)*3, 1);
    ctx.textAlign='center';
    const fs = m.size==='lg'?17:m.size==='md'?12:9;
    ctx.font=`bold ${fs}px sans-serif`;                 // sans-serif renders kana + is crisper than monospace
    const y = (m.size==='lg'?VH*0.36:VH*0.27) - i*(fs+16);
    const w = ctx.measureText(m.text).width + 24, h = fs+13;
    ctx.fillStyle='rgba(8,6,18,0.78)'; rrect(VW/2-w/2, y-h+5, w, h, 8); ctx.fill();    // contrast panel = readable on ANY backdrop
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1; rrect(VW/2-w/2, y-h+5, w, h, 8); ctx.stroke();
    ctx.fillStyle=m.clr||'#ffffff';
    ctx.fillText(m.text, VW/2, y);
    ctx.globalAlpha=1; ctx.textAlign='left';
  });

  // ── Floating damage numbers ──
  s.dmgNums.forEach(n=>{
    const nx = ~~(n.x - s.cam.x);
    const alpha = n.life/n.maxLife;
    ctx.globalAlpha = alpha;
    ctx.textAlign='center'; ctx.font='bold 9px monospace';
    ctx.fillStyle = n.clr;
    ctx.shadowColor = n.clr; ctx.shadowBlur = 4;
    ctx.fillText(n.text, nx, ~~n.y);
    ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textAlign='left';
  });

  // ── Controls hint (bottom, subtle) ──
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,VH-11,VW,11);
  ctx.fillStyle='#2a3a4a'; ctx.font='5px monospace';
  ctx.fillText('[← →] MOVE   [↑] JUMP & STOMP   [↓] DROP DOWN THRU PLATFORMS   [Z] CHOMP / FART   👥 WALK INTO TOWNSFOLK TO RESCUE', 4, VH-3);

  // ── Growth stage + orb readout (bottom right) ──
  ctx.save();
  ctx.textAlign='right'; ctx.font='12px monospace'; ctx.fillStyle='#7CD7FF';
  ctx.fillText('◈ '+meta.orbs+'  '+(Progression.GROWTH_STAGES[meta.growthStage]||Progression.GROWTH_STAGES[0]).name, VW-12, VH-16);
  ctx.restore();
}

// rounded-rect path helper (works ctx.roundRect isn't available)
function rrect(x, y, w, h, r){
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return; }
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function drawTouchControls(){
  if(!('ontouchstart' in window)) return;

  // Portrait overlay — show rotate hint but still allow play
  const isPortrait = window.innerHeight > window.innerWidth * 1.15;
  if(isPortrait){
    ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(-24,-24,VW+48,VH+48);
    ctx.textAlign='center';
    ctx.font='bold 22px monospace'; ctx.fillStyle='#22ffaa';
    ctx.fillText('📱 ROTATE YOUR PHONE', VW/2, VH/2-16);
    ctx.font='10px monospace'; ctx.fillStyle='#446644';
    ctx.fillText('landscape = best kaiju experience', VW/2, VH/2+12);
    ctx.textAlign='left';
    return;
  }

  const BS = 68, PAD = 10, GAP = 8;
  const Y  = VH - BS - PAD;

  // Left side: ◀ ▶
  BTNS.left  = {x: PAD,           y: Y, w: BS, h: BS};
  BTNS.right = {x: PAD+BS+GAP,    y: Y, w: BS, h: BS};
  // Right side: 💨 ▲
  BTNS.fart  = {x: VW-PAD-BS*2-GAP, y: Y, w: BS, h: BS};
  BTNS.jump  = {x: VW-PAD-BS,       y: Y, w: BS, h: BS};

  const drawBtn = (b, active, emoji, label, fill, glow)=>{
    ctx.save();
    // shadow glow when active
    if(active){ ctx.shadowColor=glow; ctx.shadowBlur=14; }
    // background
    ctx.globalAlpha = active ? 0.80 : 0.38;
    ctx.fillStyle = active ? fill : 'rgba(40,50,70,0.9)';
    rrect(b.x, b.y, b.w, b.h, 14); ctx.fill();
    // border
    ctx.globalAlpha = active ? 1 : 0.55;
    ctx.strokeStyle = active ? glow : 'rgba(100,130,160,0.7)';
    ctx.lineWidth = active ? 2.5 : 1.5;
    rrect(b.x, b.y, b.w, b.h, 14); ctx.stroke();
    // emoji / icon
    ctx.globalAlpha = 1; ctx.shadowBlur=0;
    ctx.textAlign='center';
    ctx.font=`${emoji?'22':'16'}px monospace`;
    ctx.fillStyle = active ? '#ffffff' : 'rgba(200,220,255,0.85)';
    ctx.fillText(emoji||label, b.x+b.w/2, b.y + (emoji?b.h*0.58:b.h*0.62));
    if(emoji && label){
      ctx.font='7px monospace'; ctx.fillStyle='rgba(255,255,255,0.55)';
      ctx.fillText(label, b.x+b.w/2, b.y+b.h-6);
    }
    ctx.textAlign='left'; ctx.restore();
  };

  drawBtn(BTNS.left,  touchInBtn('left'),  '◀', 'LEFT',  'rgba(80,120,220,0.9)',  '#88aaff');
  drawBtn(BTNS.right, touchInBtn('right'), '▶', 'RIGHT', 'rgba(80,120,220,0.9)',  '#88aaff');
  drawBtn(BTNS.fart,  touchInBtn('fart'),  '💨', 'ATK',   'rgba(40,200,100,0.9)', '#44ff88');
  drawBtn(BTNS.jump,  touchInBtn('jump'),  '▲', 'JUMP',  'rgba(220,150,40,0.9)', '#ffcc44');
}
