server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # REQUIRED for SharedArrayBuffer (love.js audio + threading)
    add_header Cross-Origin-Opener-Policy   "same-origin"    always;
    add_header Cross-Origin-Embedder-Policy "require-corp"   always;

    # Serve WASM with correct MIME type
    types {
        application/wasm         wasm;
        text/html                html htm;
        application/javascript   js;
        application/octet-stream love;
    }

    # Gzip compressible types
    gzip            on;
    gzip_types      text/html application/javascript application/wasm;
    gzip_min_length 1024;

    # Long cache for binary assets, short for HTML
    location ~* \.(js|wasm|love)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
