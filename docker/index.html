<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GAWDZILLLLA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }
    #tap-to-start {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85);
      color: #fff; font-family: monospace; font-size: 1.5rem;
      cursor: pointer; z-index: 100;
    }
    #status {
      position: fixed; bottom: 1rem; left: 0; right: 0;
      text-align: center; color: #666; font-family: monospace; font-size: 0.8rem;
      pointer-events: none; z-index: 50;
    }
  </style>
</head>
<body>
  <div id="tap-to-start">TAP TO START</div>
  <div id="status"></div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    var loveScript = document.createElement('script');
    loveScript.src = 'lovejs/love.js';
    loveScript.onload = function() {
      document.getElementById('tap-to-start').addEventListener('click', function() {
        this.style.display = 'none';
        startGame();
      }, { once: true });
      document.getElementById('status').textContent = 'tap to start';
    };
    loveScript.onerror = function() {
      document.getElementById('status').textContent = 'failed to load engine';
    };
    document.body.appendChild(loveScript);

    function startGame() {
      var status = document.getElementById('status');
      status.textContent = 'loading game...';

      // love.js exports itself as a factory function: Love(config) => module
      // config properties are merged into the module object before preRun runs,
      // so config.addRunDependency / config.FS_createDataFile are available inside preRun.
      var config = {
        canvas: document.getElementById('canvas'),
        arguments: ['/game.love'],
        INITIAL_MEMORY: 268435456,
        preRun: [function() {
          config.addRunDependency('fetch-game-love');
          status.textContent = 'fetching game...';
          var xhr = new XMLHttpRequest();
          xhr.open('GET', 'game.love');
          xhr.responseType = 'arraybuffer';
          xhr.onload = function() {
            config.FS_createDataFile('/', 'game.love', new Uint8Array(xhr.response), true, true);
            status.textContent = 'starting...';
            config.removeRunDependency('fetch-game-love');
          };
          xhr.onerror = function() {
            status.textContent = 'error: could not fetch game.love';
          };
          xhr.send();
        }],
        onRuntimeInitialized: function() {
          status.textContent = '';
        },
        print: function(text) { console.log(text); },
        printErr: function(text) { console.error(text); },
        locateFile: function(path) { return 'lovejs/' + path; },
      };

      Love(config);
    }
  </script>
</body>
</html>
