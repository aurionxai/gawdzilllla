<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GAWDZILLLLA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }
    #tap-to-start {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85);
      color: #fff; font-family: monospace; font-size: 1.5rem;
      cursor: pointer; z-index: 100;
    }
  </style>
</head>
<body>
  <div id="tap-to-start">TAP TO START</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    // Unlock Web Audio on first user gesture (required by all modern browsers)
    document.getElementById('tap-to-start').addEventListener('click', function() {
      this.style.display = 'none';
      startGame();
    }, { once: true });

    function startGame() {
      // love.js reads window.Love (not window.Module)
      var Love = {
        canvas: document.getElementById('canvas'),
        arguments: ['/game.love'],
        INITIAL_MEMORY: 268435456,
        // Fetch game.love into Emscripten virtual FS before main() runs
        preRun: [function() {
          Love.addRunDependency('fetch-game-love');
          var xhr = new XMLHttpRequest();
          xhr.open('GET', 'game.love');
          xhr.responseType = 'arraybuffer';
          xhr.onload = function() {
            var data = new Uint8Array(xhr.response);
            FS.createDataFile('/', 'game.love', data, true, true);
            Love.removeRunDependency('fetch-game-love');
          };
          xhr.onerror = function() {
            console.error('Failed to fetch game.love');
          };
          xhr.send();
        }],
        onRuntimeInitialized: function() {
          console.log('love.js runtime ready');
        },
        print: function(text) { console.log(text); },
        printErr: function(text) { console.error(text); },
        locateFile: function(path) { return 'lovejs/' + path; },
      };
      window.Love = Love;
      var script = document.createElement('script');
      script.src = 'lovejs/love.js';
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
